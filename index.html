<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<title>Jaguarete'i Guaraní</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: app de una columna; camino en zigzag de niveles, lecciones a pantalla completa, panel familiar aparte */
:root{
  --bg:#F3F6EC; --card:#FFFFFF; --ink:#1D2A23; --muted:#5A6C60; --line:#D6DFCB; --soft:#E8EFDD;
  --accent:#C2185B; --accent-d:#8E0F42; --ok:#2E9E52; --ok-d:#1F7038; --ok-bg:#DDF3E3;
  --bad:#D63B3B; --bad-d:#9C2525; --bad-bg:#FBE1E1; --gold:#E8A317; --gold-d:#B37A06; --lock:#B9C3B0;
  --t1:#C2185B; --t2:#D98E04; --t3:#1F7A5A; --t4:#2B6CB0; --t5:#D9531E;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13201A; --card:#1C2C24; --ink:#EEF4EA; --muted:#A6B8AB; --line:#30463A; --soft:#22362C;
  --accent:#F06292; --accent-d:#B23A66; --ok:#4CC27A; --ok-d:#2C8A50; --ok-bg:#1D3B28;
  --bad:#F07272; --bad-d:#B04545; --bad-bg:#40221F; --gold:#F2B63D; --gold-d:#B8831B; --lock:#3F5546;
  --t1:#F06292; --t2:#F2B63D; --t3:#5CC79A; --t4:#6FA8E8; --t5:#F2895A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13201A; --card:#1C2C24; --ink:#EEF4EA; --muted:#A6B8AB; --line:#30463A; --soft:#22362C;
  --accent:#F06292; --accent-d:#B23A66; --ok:#4CC27A; --ok-d:#2C8A50; --ok-bg:#1D3B28;
  --bad:#F07272; --bad-d:#B04545; --bad-bg:#40221F; --gold:#F2B63D; --gold-d:#B8831B; --lock:#3F5546;
  --t1:#F06292; --t2:#F2B63D; --t3:#5CC79A; --t4:#6FA8E8; --t5:#F2895A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
.gn{font-family:var(--display);font-weight:800}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--t4);outline-offset:2px}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:2px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--accent);margin-right:auto;min-width:0}
.brand svg{width:36px;height:36px;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){.brand span{display:none}}
.stat{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:800;font-size:1.1rem}
.stat svg{width:24px;height:24px}
.iconbtn{background:none;border:2px solid var(--line);border-radius:12px;padding:4px 10px;cursor:pointer;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:6px}
.iconbtn svg{width:18px;height:18px}

/* Inicio */
.home{max-width:640px;margin:0 auto;padding-block:16px 60px}
.hello{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px}
.hello .ill{width:64px;height:64px}
.hello h2{font-size:1.35rem}
.goal-bar{height:14px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:6px}
.goal-bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .4s}
.hello small{color:var(--muted);font-weight:700}

.unit{margin-top:26px}
.banner{border-radius:18px;padding:12px 16px;color:#fff;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner .eb{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.banner h3{font-size:1.35rem}
.banner .es{font-weight:700}
.banner button{flex:none;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6);color:#fff;border-radius:12px;padding:6px 10px;font-weight:800;cursor:pointer;font-size:.85rem}
.banner.locked{background:var(--lock)!important;color:var(--ink)}
.banner.locked button{display:none}
.nodewrap{display:flex;flex-direction:column;align-items:center;padding-block:48px 0;position:relative}
.node{width:84px;height:78px;border-radius:50%;border:0;cursor:pointer;position:relative;display:grid;place-items:center;transition:transform .1s}
.node svg{width:42px;height:42px}
.node:active{transform:translateY(5px)}
.node.locked{background:var(--lock);box-shadow:0 7px 0 color-mix(in srgb,var(--lock) 70%,#000);cursor:not-allowed}
.crowns{display:flex;gap:4px;margin-top:12px}
.crowns svg{width:20px;height:20px}
.tipbubble{position:absolute;top:4px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:2px 12px;font-family:var(--display);font-weight:800;color:var(--accent);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.tipbubble{animation:bob 1.4s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-5px)}}
.store-note{margin-top:30px;color:var(--muted);font-size:.85rem;text-align:center}

/* Pantallas superpuestas */
.screen{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fam-head{max-width:860px!important}.lhead{max-width:640px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:12px}
.close{background:none;border:0;cursor:pointer;padding:4px;color:var(--muted)}
.close svg{width:28px;height:28px}
.prog{flex:1;height:18px;background:var(--soft);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .35s}
.lbody{flex:1;overflow-y:auto;width:100%}
.lbody-in{max-width:640px;margin:0 auto;padding-block:10px 24px}
.ask{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:end;margin-bottom:18px}
.ask .mascot{width:70px;height:70px}
.say{background:var(--card);border:2px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;font-weight:700;font-size:1.1rem;min-width:0}
.say b.gn{color:var(--accent);font-size:1.25rem}
.kind{font-family:var(--display);font-weight:800;font-size:1.4rem;margin-bottom:10px}

.choices{display:grid;gap:10px}
.choices.pics{grid-template-columns:repeat(2,1fr)}
.ch{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:12px;min-width:0;overflow-wrap:anywhere}
.ch.g{font-family:var(--display);font-size:1.3rem}
.ch .k{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:.85rem;color:var(--muted)}
.pics .ch{flex-direction:column;justify-content:center;text-align:center;padding:12px}
.pics .ch .ill{width:96px;height:96px}
.pics .ch .cap{font-size:.95rem;color:var(--muted);visibility:hidden}
.ch.sel{border-color:var(--t4);background:color-mix(in srgb,var(--t4) 12%,var(--card))}
.ch.right{border-color:var(--ok);background:var(--ok-bg)}
.ch.wrong{border-color:var(--bad);background:var(--bad-bg)}
.ch.right .cap,.ch.wrong .cap{visibility:visible}
.ch:disabled{cursor:default}
.ch.gone{opacity:.35}
.hero-pic{display:flex;justify-content:center;margin-bottom:12px}
.hero-pic .ill{width:140px;height:140px;background:var(--card);border-radius:24px;border:2px solid var(--line);padding:8px}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;min-width:0}

.build-line{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-block:8px;margin-bottom:18px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:1.2rem;cursor:pointer}
.tile.used{visibility:hidden}

.lfoot{border-top:2px solid var(--line);background:var(--card)}
.lfoot-in{max-width:640px;margin:0 auto;padding-block:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.lfoot.ok{background:var(--ok-bg);border-color:var(--ok)}
.lfoot.bad{background:var(--bad-bg);border-color:var(--bad)}
.fbtxt{min-width:0;flex:1 1 220px}
.fbtxt h3{font-size:1.4rem}
.lfoot.ok .fbtxt h3{color:var(--ok-d)} .lfoot.bad .fbtxt h3{color:var(--bad-d)}
:root[data-theme="dark"] .lfoot.ok .fbtxt h3{color:var(--ok)} :root[data-theme="dark"] .lfoot.bad .fbtxt h3{color:var(--bad)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lfoot.ok .fbtxt h3{color:var(--ok)} :root:not([data-theme="light"]) .lfoot.bad .fbtxt h3{color:var(--bad)}}
.fbtxt p{font-weight:700}
.big{border:0;border-radius:16px;padding:12px 26px;font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;color:#fff;background:var(--ok);box-shadow:0 5px 0 var(--ok-d);min-width:160px;flex:1 1 auto;max-width:100%}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ok-d)}
.big:disabled{background:var(--lock);box-shadow:0 5px 0 color-mix(in srgb,var(--lock) 70%,#000);cursor:not-allowed;color:var(--card)}
.big.red{background:var(--bad);box-shadow:0 5px 0 var(--bad-d)}
.big.pink{background:var(--accent);box-shadow:0 5px 0 var(--accent-d)}
.big.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}

/* Palabras nuevas */
.learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lc{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.lc .ill{width:70px;height:70px}
.lc .w{font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--accent);overflow-wrap:anywhere;line-height:1.15}
.lc .t{font-weight:700}
.lc .note{font-size:.78rem;font-weight:700;color:var(--t3);margin-top:2px}
.ltip{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.ltip .badge{font-family:var(--display);color:#fff;background:var(--t3);border-radius:10px;padding:2px 10px;white-space:nowrap}
.ltip p{min-width:0}
.lc .p{font-size:.75rem;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 8px;margin-top:4px}
@media (max-width:420px){.learn{grid-template-columns:1fr 1fr}}

/* Resultado */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:24px}
.result .mascot{width:130px;height:130px}
.result h2{font-size:2rem;color:var(--gold-d)}
:root[data-theme="dark"] .result h2{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .result h2{color:var(--gold)}}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:460px}
.rs{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--card)}
.rs b{display:block;background:var(--c);color:#fff;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;padding:3px}
.rs span{display:block;font-family:var(--display);font-weight:800;font-size:1.5rem;padding:6px;font-variant-numeric:tabular-nums}

/* Panel familiar */
.fam{max-width:860px;margin:0 auto;padding-block:8px 60px;display:grid;gap:18px}
.fam .field input{width:110px}
.fam h2{font-size:1.7rem}
.fam h3{font-size:1.2rem;margin-bottom:8px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tl{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.tl small{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tl b{font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}
.chart svg{width:100%;height:auto;display:block}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n{font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:800}
.pill.none{background:var(--soft);color:var(--muted)}
.pill.prac{background:color-mix(in srgb,var(--gold) 25%,var(--card));color:var(--ink)}
.pill.dom{background:var(--ok-bg);color:var(--ink)}
.pill.low{background:var(--bad-bg);color:var(--ink)}
.words{display:flex;flex-wrap:wrap;gap:8px}
.wchip{border:2px solid var(--line);border-radius:12px;padding:4px 10px}
.wchip .gn{color:var(--accent)}
.wchip small{color:var(--muted);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field input{font:inherit;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);color:var(--ink);width:180px;max-width:100%}
.smallbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 14px;font-weight:800;cursor:pointer}
.smallbtn.danger{border-color:var(--bad);color:var(--bad)}
.muted{color:var(--muted)}
.gate{max-width:420px;margin:40px auto;text-align:center;display:grid;gap:14px;justify-items:center}
.gate input{font:inherit;font-family:var(--display);font-size:1.6rem;font-weight:800;width:120px;text-align:center;border:2px solid var(--line);border-radius:14px;padding:6px;background:var(--card);color:var(--ink)}
.err{color:var(--bad);font-weight:800;min-height:1.4em}
.brand .ava,.brand svg{width:36px;height:36px;flex:none}
@media (max-width:440px){.iconbtn .lbl{display:none}}
.login{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:24px 40px}
.login .mascot{width:110px;height:110px}
.plist{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:8px}
.pcard{background:var(--card);border:2px solid var(--line);border-bottom-width:6px;border-radius:20px;padding:14px 18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:140px}
.pcard .ava{width:84px;height:84px}
.pcard .gn{font-size:1.4rem}
.namein{font:inherit;font-family:var(--display);font-weight:800;font-size:1.5rem;text-align:center;width:260px;max-width:100%;border:3px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:6px 12px;background:var(--card);color:var(--ink)}
.namein:focus{border-color:var(--accent);outline:none}
#mascotHold{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.whogrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:460px;margin-top:6px}
.who{background:var(--card);border:2px solid var(--line);border-bottom-width:6px;border-radius:20px;padding:16px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.who .ill{width:96px;height:96px}
.who .gn{font-size:1.35rem;color:var(--accent)}
.who small{color:var(--muted);font-weight:700}
.who:active{transform:translateY(3px)}
.newacc{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:10px;font-weight:800}
.pwk.picked{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.gate .mascot{width:90px;height:90px}
.pwgrid.busy{opacity:.55;pointer-events:none}
.dots{display:flex;gap:12px;margin-block:4px 8px}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--accent);display:block}
.dots i.on{background:var(--accent)}
.pwgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:360px;margin:0 auto}
.pwk{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pwk .ill{width:64px;height:64px}
.pwk .gn{font-size:.95rem;color:var(--accent)}
.pwk:active{transform:translateY(3px)}
.pwk:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .4s}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.setup{max-width:640px;margin:0 auto;padding-block:10px 40px;display:grid;gap:14px}
.field{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-weight:700}
.field input{font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);width:180px;max-width:100%}
.avgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:6px}
@media (max-width:520px){.avgrid{grid-template-columns:repeat(4,1fr)}}
.avb{background:var(--bg);border:3px solid var(--line);border-radius:14px;padding:4px;cursor:pointer;min-width:0}
.avb .ill{width:100%;height:auto;aspect-ratio:1}
.avb.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.pwdots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;min-height:76px;margin-bottom:10px}
.pwchosen{display:flex;flex-direction:column;align-items:center;background:var(--soft);border-radius:12px;padding:4px 8px}
.pwchosen .ill{width:44px;height:44px}
.pwchosen small{color:var(--accent)}
.arrow{font-weight:800;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px 4px 6px;font-weight:800;cursor:pointer}
.chip[data-f="all"]{padding-left:14px}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.cava{width:26px;height:26px}
.plrows{display:grid;gap:8px}
.plrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-block:6px}
.cava2{width:40px;height:40px}
.panel.alert{border-color:var(--bad);background:var(--bad-bg)}
.sendgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.sendgrid{grid-template-columns:1fr}}
.sendbox{border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;display:grid;gap:8px;align-content:start}
.sendbox h4{margin:0;font-family:var(--display);font-size:1.1rem;display:flex;gap:6px;align-items:center}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.95rem}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.wa{display:inline-flex;gap:8px;align-items:center;justify-content:center;background:#1FA855;color:#fff;text-decoration:none;font-weight:800;border-radius:14px;padding:10px 16px;box-shadow:0 4px 0 #157A3D;justify-self:start}
.wa:active{transform:translateY(2px);box-shadow:0 2px 0 #157A3D}
.steps summary{cursor:pointer;font-weight:800;color:var(--t4)}
.steps ol{padding-left:20px;display:grid;gap:6px;margin:10px 0}
.steps code{background:var(--soft);border-radius:6px;padding:0 4px}
.code{width:100%;height:180px;margin-top:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px;white-space:pre;overflow:auto}
.revcard{margin-top:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:2px solid var(--accent);border-radius:20px;padding:12px 16px}
.revcard .eb{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.revcard h3{font-size:1.25rem}
.games{margin-top:18px}
.sect{font-size:1.2rem;margin-bottom:8px}
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.ggrid{grid-template-columns:1fr 1fr}}
.gcard{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.gcard .ill{width:56px;height:56px}
.gcard .gn{font-size:1.02rem;color:var(--accent);line-height:1.15}
.gcard small{color:var(--muted);font-weight:700;font-size:.78rem;line-height:1.25}
.gcard:disabled{opacity:.45;cursor:not-allowed}
.gcard:not(:disabled):active{transform:translateY(3px)}
.cpb{color:#3a2a00}
.cpb button{color:#3a2a00;border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.3)}
.bank.letters .tile,.build-line.letters .tile{min-width:44px;text-align:center;font-size:1.35rem}
.gstat{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ghelp{text-align:center;font-weight:700;margin-bottom:10px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:0 auto}
@media (max-width:460px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mcard{position:relative;aspect-ratio:3/4;max-width:100%;border:0;padding:0;background:none;cursor:pointer;perspective:600px}
.mcard>span{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;backface-visibility:hidden;transition:transform .35s;border:2px solid var(--line);border-bottom-width:5px}
.mcard .back{background:var(--card)}
.mcard .back .nd{width:70%;height:auto}
.mcard .front{background:var(--card);transform:rotateY(180deg);padding:4px}
.mcard .front .ill{width:70%;height:auto}
.mcard .front b{font-size:1.1rem;color:var(--accent);overflow-wrap:anywhere;text-align:center}
.mcard .front small{color:var(--muted);font-weight:700;font-size:.72rem;visibility:hidden}
.mcard.up .back{transform:rotateY(180deg)}
.mcard.up .front{transform:rotateY(360deg)}
.mcard.done .front{border-color:var(--ok);background:var(--ok-bg)}
.mcard.done .front small{visibility:visible}
@media (prefers-reduced-motion:reduce){.mcard>span{transition:none}}
.rain{position:relative;height:min(56vh,460px);border-radius:20px;overflow:hidden;background:linear-gradient(var(--soft),var(--card));border:2px solid var(--line)}
.rain::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:var(--t3);opacity:.5}
.drop{position:absolute;top:0;width:30%;border:0;cursor:pointer;background:#4FA3D9;color:#fff;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;padding:14px 6px 12px;box-shadow:0 4px 0 #2B6CB0;min-height:62px;display:flex;align-items:center;justify-content:center}
.drop .gn{font-size:1.05rem;line-height:1.1;overflow-wrap:normal;word-break:normal;hyphens:none}
.drop .gn.long{font-size:.82rem}
.drop.pop{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.drop.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-d);opacity:.6}
.drop.missed{background:var(--gold);box-shadow:0 4px 0 var(--gold-d)}
.rprompt{margin-top:12px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 14px}
.rprompt .ill{width:72px;height:72px}
.rprompt small{display:block;color:var(--muted);font-weight:700}
.rprompt b{font-family:var(--display);font-size:1.5rem}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 16px}
.slot{min-width:42px;height:50px;border-bottom:4px solid var(--line);font-family:var(--display);font-weight:800;font-size:1.6rem;display:grid;place-items:center;color:var(--accent)}
.slot.ok{border-color:var(--ok)}
.tile.hint{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 25%,var(--card))}
.tile.shake{border-color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.tile.shake{animation:shake .4s}.tile.hint{animation:bob 1s ease-in-out infinite}}
.okmsg{color:var(--ok-d);font-weight:800;text-align:center;min-height:1.4em}
#lmsg{text-align:center}
.fast{display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:24px;padding:16px 8px;transition:background .3s}
.fast.flash-ok{background:var(--ok-bg)}
.fast.flash-bad{background:var(--bad-bg)}
.fword .gn{font-size:2rem;color:var(--accent)}
.fbonus{min-height:1.4em;font-weight:800}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:460px}
.fbtns .big{min-width:0;padding-inline:8px;font-size:1.05rem}
.toast{width:max-content;max-width:90vw;text-align:center;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:12px;font-weight:800;z-index:40}
</style>

</head>
<body>
<header class="top pad">
  <div class="top-in">
    <div class="brand" id="brand"></div>
    <div class="stat" title="Días seguidos" id="stStreak"></div>
    <div class="stat" title="Puntos XP" id="stXp"></div>
    <button class="iconbtn" type="button" id="famBtn" aria-label="Panel para la familia"></button>
    <button class="iconbtn" type="button" id="outBtn" aria-label="Salir y cambiar de jugador" hidden></button>
  </div>
</header>
<main class="home pad" id="home"></main>
<div id="layer"></div>

<script>
(function(){
/* ---------- Ilustraciones ---------- */
const G = s => `<svg viewBox="0 0 80 80" class="ill" aria-hidden="true"><g style="stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round" fill="none">${s}</g></svg>`;
const INK = 'style="fill:var(--ink)" stroke="none"';
const SK = '#E0A97E', YEL='#F7B731', PINK='#E8437A', BLUE='#4FA3D9', GREEN='#5DBB63', RED='#E85D5D', BROWN='#8A5A3B', CREAM='#FAF3E0';
const eyes = (a,b,y,r=2.2)=>`<circle cx="${a}" cy="${y}" r="${r}" ${INK}/><circle cx="${b}" cy="${y}" r="${r}" ${INK}/>`;
function rays(cx,cy,r1,r2,angles){return angles.map(a=>{const t=a*Math.PI/180;return `<line x1="${(cx+r1*Math.cos(t)).toFixed(1)}" y1="${(cy+r1*Math.sin(t)).toFixed(1)}" x2="${(cx+r2*Math.cos(t)).toFixed(1)}" y2="${(cy+r2*Math.sin(t)).toFixed(1)}"/>`}).join('')}
function starPts(cx,cy,R,r){let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}
const hand = `<rect x="21" y="12" width="9" height="34" rx="4.5" fill="${SK}"/><rect x="30" y="8" width="9" height="36" rx="4.5" fill="${SK}"/><rect x="39" y="9" width="9" height="36" rx="4.5" fill="${SK}"/><rect x="48" y="14" width="9" height="32" rx="4.5" fill="${SK}"/><rect x="8" y="40" width="22" height="9" rx="4.5" fill="${SK}" transform="rotate(35 19 44)"/><rect x="20" y="34" width="38" height="34" rx="13" fill="${SK}"/>`;
const cloud = `<path d="M18 46 A11 11 0 0 1 22 25 A16 16 0 0 1 52 21 A12 12 0 0 1 62 46 Z" fill="#CFD8E3"/>`;

function person(o){
  const hc=o.hc||'#4A2E1F'; let s='';
  if(o.hair==='long') s+=`<path d="M25 30 Q25 12 40 12 Q55 12 55 30 L57 52 L23 52Z" fill="${hc}"/>`;
  if(o.hair==='pig') s+=`<circle cx="24" cy="31" r="6" fill="${hc}"/><circle cx="56" cy="31" r="6" fill="${hc}"/>`;
  if(o.hair==='bun') s+=`<circle cx="40" cy="13" r="6.5" fill="${hc}"/>`;
  s+=`<path d="M20 75 Q20 48 40 48 Q60 48 60 75Z" fill="${o.shirt}"/>`;
  s+=`<circle cx="40" cy="31" r="13" fill="${SK}"/>`;
  s+=`<path d="M27 29 Q28 16 40 16 Q52 16 53 29 Q46 23 40 23 Q33 23 27 29Z" fill="${hc}"/>`;
  s+=eyes(35.5,44.5,31,1.9);
  if(o.beard) s+=`<path d="M30 35 Q40 48 50 35 Q46 42 40 42 Q34 42 30 35Z" fill="${hc}"/>`;
  else s+=`<path d="M36 36 Q40 39.5 44 36"/>`;
  if(o.mus) s+=`<path d="M35 35.5 Q40 33 45 35.5" style="stroke-width:3"/>`;
  if(o.glasses) s+=`<circle cx="35.5" cy="31" r="4.2" style="stroke-width:1.8"/><circle cx="44.5" cy="31" r="4.2" style="stroke-width:1.8"/><line x1="39.7" y1="31" x2="40.3" y2="31" style="stroke-width:1.8"/>`;
  if(o.cane) s+=`<path d="M66 76 L66 50 Q66 43 60 45" style="stroke-width:3.4"/>`;
  return s;
}
const place=(inner,cx,sc)=>`<g transform="translate(${cx} 77) scale(${sc}) translate(-40 -76)">${inner}</g>`;
const P={
  mom:{hair:'long',shirt:PINK}, dad:{hair:'short',shirt:'#2B6CB0',mus:1},
  gma:{hair:'bun',hc:'#B9B9B9',shirt:'#9B59B6',glasses:1,cane:1},
  gpa:{hair:'short',hc:'#B9B9B9',shirt:'#1F7A5A',glasses:1,beard:1,cane:1},
  girl:{hair:'pig',shirt:YEL}, boy:{hair:'short',shirt:GREEN},
  teenG:{hair:'long',hc:'#2B1A12',shirt:'#1F9E9E'}, teenB:{hair:'short',hc:'#2B1A12',shirt:'#D9531E'}
};
function catHead(fill,spots){
  let s=`<path d="M21 36 L23 12 L38 25Z" fill="${fill}"/><path d="M59 36 L57 12 L42 25Z" fill="${fill}"/><circle cx="40" cy="43" r="21" fill="${fill}"/>`;
  if(spots) s+=[[28,34],[52,34],[24,46],[56,46],[40,28],[33,58],[47,58]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.6" ${INK}/>`).join('');
  s+=eyes(32,48,41,2.6)+`<path d="M37 49 L43 49 L40 53Z" fill="${PINK}"/><path d="M40 53 Q40 57 36 58 M40 53 Q40 57 44 58"/>`;
  s+=`<path d="M29 52 L13 49 M29 55 L13 59 M51 52 L67 49 M51 55 L67 59" style="stroke-width:1.8"/>`;
  return s;
}
function dog(fill,ear,muz){
  return `<ellipse cx="21" cy="38" rx="8" ry="15" fill="${ear}" transform="rotate(20 21 38)"/><ellipse cx="59" cy="38" rx="8" ry="15" fill="${ear}" transform="rotate(-20 59 38)"/><circle cx="40" cy="42" r="20" fill="${fill}"/><ellipse cx="40" cy="53" rx="11" ry="8" fill="${muz}"/><ellipse cx="40" cy="48" rx="4.6" ry="3.3" ${INK}/>`+eyes(33,47,39,2.5)+`<path d="M40 51 Q40 56 36 57 M40 51 Q40 56 44 57"/>`;
}
const foot=(x,y,r)=>`<g transform="rotate(${r} ${x} ${y})"><ellipse cx="${x}" cy="${y}" rx="7" ry="11" fill="${SK}"/><circle cx="${x-5}" cy="${y-14}" r="2.4" fill="${SK}"/><circle cx="${x}" cy="${y-15.5}" r="2.6" fill="${SK}"/><circle cx="${x+5}" cy="${y-14}" r="2.4" fill="${SK}"/></g>`;

const IC={
  sun:()=>G(rays(40,40,22,31,[0,45,90,135,180,225,270,315])+`<circle cx="40" cy="40" r="16" fill="${YEL}"/>`+eyes(34,46,38)+`<path d="M34 45 Q40 50 46 45"/>`),
  sunrise:()=>G(rays(40,58,25,33,[-160,-125,-90,-55,-20])+`<path d="M21 58 A19 19 0 0 1 59 58 Z" fill="${YEL}"/><line x1="6" y1="58" x2="74" y2="58"/><line x1="18" y1="66" x2="34" y2="66"/><line x1="44" y1="66" x2="62" y2="66"/>`),
  sunset:()=>G(`<path d="M25 60 A15 15 0 0 1 55 60 Z" fill="#F0803C"/><line x1="6" y1="60" x2="74" y2="60"/><line x1="22" y1="68" x2="36" y2="68"/><line x1="44" y1="68" x2="58" y2="68"/><path d="M14 22 Q18 18 22 22 Q26 18 30 22"/><path d="M50 30 Q53 27 56 30 Q59 27 62 30"/>`),
  moon:()=>G(`<path d="M50 12 A28 28 0 1 0 68 54 A21 21 0 1 1 50 12 Z" fill="#F3E3A0"/><polygon points="${starPts(64,20,6,2.6)}" fill="${YEL}"/><polygon points="${starPts(60,40,4,1.8)}" fill="${YEL}"/>`),
  star:()=>G(`<polygon points="${starPts(40,42,30,13)}" fill="${YEL}"/>`+eyes(35,45,42,2)+`<path d="M36 48 Q40 51 44 48"/>`),
  heart:()=>G(`<path d="M40 66 C10 46 12 18 29 18 C35 18 39 23 40 28 C41 23 45 18 51 18 C68 18 70 46 40 66Z" fill="${PINK}"/>`),
  hand:()=>G(hand+`<path d="M64 16 Q71 25 66 34" /><path d="M70 9 Q80 24 72 40"/>`),
  smile:()=>G(`<circle cx="40" cy="40" r="25" fill="${YEL}"/>`+eyes(32,48,35,2.8)+`<path d="M29 46 Q40 58 51 46"/><circle cx="26" cy="46" r="4" fill="#F4A7B9" stroke="none"/><circle cx="54" cy="46" r="4" fill="#F4A7B9" stroke="none"/>`),
  check:()=>G(`<circle cx="40" cy="40" r="26" fill="#3FA55A"/><path d="M27 41 L36 51 L54 30" style="stroke:#fff;stroke-width:5"/>`),
  cross:()=>G(`<circle cx="40" cy="40" r="26" fill="${RED}"/><path d="M30 30 L50 50 M50 30 L30 50" style="stroke:#fff;stroke-width:5"/>`),
  tag:()=>G(`<rect x="10" y="20" width="60" height="42" rx="7" fill="#fff"/><path d="M10 33 L10 27 Q10 20 17 20 L63 20 Q70 20 70 27 L70 33Z" fill="${PINK}"/><circle cx="25" cy="47" r="7" fill="${SK}"/><line x1="37" y1="44" x2="60" y2="44"/><line x1="37" y1="53" x2="52" y2="53"/>`),
  ask:()=>G(`<path d="M16 14 H64 A7 7 0 0 1 71 21 V48 A7 7 0 0 1 64 55 H36 L22 67 V55 H16 A7 7 0 0 1 9 48 V21 A7 7 0 0 1 16 14Z" fill="#fff"/><text x="40" y="47" text-anchor="middle" font-size="32" font-weight="800" font-family="Baloo 2, sans-serif" style="fill:#C2185B" stroke="none">?</text>`),
  kids:()=>G(place(person(P.girl),25,.72)+place(person(P.boy),55,.72)),
  family:()=>G(place(person(P.dad),20,.64)+place(person(P.mom),60,.64)+place(person(P.girl),40,.5)),
  dog:()=>G(dog('#D9A066',BROWN,'#F3D9B5')),
  toto:()=>G(dog('#FFFFFF','#2B2B2B','#E9E9E9')+`<circle cx="47" cy="38" r="6" fill="#2B2B2B" stroke="none" opacity=".85"/>`+`<circle cx="47" cy="39" r="2.5" fill="#fff" stroke="none"/>`),
  cat:()=>G(catHead('#9AA5B1',0)),
  jaguar:()=>G(catHead('#F2B13C',1)),
  cow:()=>G(`<path d="M26 25 Q14 22 15 10 Q21 19 30 21Z" fill="#F3E3A0"/><path d="M54 25 Q66 22 65 10 Q59 19 50 21Z" fill="#F3E3A0"/><ellipse cx="18" cy="34" rx="8" ry="5" fill="#fff"/><ellipse cx="62" cy="34" rx="8" ry="5" fill="#fff"/><rect x="23" y="18" width="34" height="44" rx="15" fill="#fff"/><ellipse cx="31" cy="29" rx="6" ry="5" ${INK}/><ellipse cx="40" cy="57" rx="15" ry="10" fill="#F4A7B9"/><circle cx="35" cy="57" r="2.4" ${INK}/><circle cx="45" cy="57" r="2.4" ${INK}/>`+eyes(33,47,40,2.6)),
  hen:()=>G(`<line x1="36" y1="66" x2="36" y2="75" style="stroke:#D98E04"/><line x1="48" y1="66" x2="48" y2="75" style="stroke:#D98E04"/><path d="M58 40 Q72 30 70 48 Q66 52 58 52Z" fill="${BROWN}"/><circle cx="43" cy="49" r="19" fill="#fff"/><circle cx="30" cy="29" r="11" fill="#fff"/><path d="M23 20 Q25 11 30 17 Q32 9 37 17 Q42 12 39 22Z" fill="${RED}"/><polygon points="19,28 11,31 19,34" fill="${YEL}"/><ellipse cx="22" cy="37" rx="3" ry="4.5" fill="${RED}"/><circle cx="29" cy="27" r="2.2" ${INK}/><path d="M37 49 Q47 40 57 49 Q47 58 37 49Z" fill="#F3E3A0"/>`),
  fish:()=>G(`<polygon points="54,40 72,26 72,54" fill="#2B6CB0"/><ellipse cx="34" cy="40" rx="24" ry="15" fill="${BLUE}"/><circle cx="20" cy="36" r="4.5" fill="#fff"/><circle cx="20" cy="36" r="2" ${INK}/><path d="M32 30 Q38 40 32 50 M40 30 Q46 40 40 50"/><path d="M12 44 Q15 46 18 44"/><circle cx="10" cy="18" r="3"/><circle cx="16" cy="10" r="2"/>`),
  bird:()=>G(`<polygon points="18,44 4,34 6,54" fill="#2B6CB0"/><ellipse cx="36" cy="46" rx="21" ry="15" fill="${BLUE}"/><circle cx="55" cy="32" r="11" fill="${BLUE}"/><polygon points="65,29 76,33 65,37" fill="${YEL}"/><circle cx="57" cy="30" r="2.2" ${INK}/><path d="M26 44 Q38 32 48 44 Q38 54 26 44Z" fill="#2B6CB0"/><line x1="32" y1="61" x2="30" y2="72"/><line x1="42" y1="61" x2="44" y2="72"/>`),
  butterfly:()=>G(`<path d="M37 26 Q30 10 24 8 M43 26 Q50 10 56 8"/><ellipse cx="25" cy="31" rx="15" ry="13" fill="${PINK}"/><ellipse cx="55" cy="31" rx="15" ry="13" fill="${PINK}"/><ellipse cx="28" cy="53" rx="11" ry="10" fill="${YEL}"/><ellipse cx="52" cy="53" rx="11" ry="10" fill="${YEL}"/><circle cx="23" cy="30" r="4" fill="#fff" stroke="none"/><circle cx="57" cy="30" r="4" fill="#fff" stroke="none"/><ellipse cx="40" cy="42" rx="4.5" ry="20" ${INK}/>`),
  snake:()=>G(`<path d="M10 64 C22 42 32 74 44 54 S58 34 62 30" style="stroke-width:13"/><path d="M10 64 C22 42 32 74 44 54 S58 34 62 30" style="stroke:${GREEN};stroke-width:8"/><path d="M74 26 L80 23 M74 26 L80 30" style="stroke:${RED};stroke-width:2"/><ellipse cx="65" cy="27" rx="10" ry="7.5" fill="${GREEN}"/><circle cx="67" cy="24" r="2" ${INK}/>`),
  frog:()=>G(`<circle cx="26" cy="32" r="10" fill="${GREEN}"/><circle cx="54" cy="32" r="10" fill="${GREEN}"/><ellipse cx="40" cy="51" rx="27" ry="19" fill="${GREEN}"/><circle cx="26" cy="31" r="6" fill="#fff"/><circle cx="54" cy="31" r="6" fill="#fff"/><circle cx="26" cy="31" r="2.8" ${INK}/><circle cx="54" cy="31" r="2.8" ${INK}/><path d="M25 52 Q40 63 55 52"/><circle cx="22" cy="58" r="3.5" fill="#F4A7B9" stroke="none"/><circle cx="58" cy="58" r="3.5" fill="#F4A7B9" stroke="none"/>`),
  face:()=>G(`<circle cx="40" cy="42" r="25" fill="${SK}"/><path d="M15 40 Q15 14 40 14 Q65 14 65 40 Q57 26 40 26 Q23 26 15 40Z" fill="#4A2E1F"/>`+eyes(32,48,44,2.6)+`<path d="M32 53 Q40 59 48 53"/>`),
  eye:()=>G(`<path d="M8 40 Q40 10 72 40 Q40 70 8 40Z" fill="#fff"/><circle cx="40" cy="40" r="12" fill="#6B4A2B"/><circle cx="40" cy="40" r="5" ${INK}/><circle cx="44" cy="36" r="2.5" fill="#fff" stroke="none"/><path d="M14 30 L10 24 M26 22 L24 15 M40 19 L40 12 M54 22 L56 15 M66 30 L70 24"/>`),
  nose:()=>G(`<path d="M40 10 Q39 38 26 52 Q22 62 33 63 Q37 60 40 62 Q43 60 47 63 Q58 62 54 52 Q41 38 40 10Z" fill="${SK}"/><ellipse cx="34" cy="57" rx="3" ry="2" ${INK}/><ellipse cx="46" cy="57" rx="3" ry="2" ${INK}/>`),
  mouth:()=>G(`<path d="M10 40 Q26 26 40 33 Q54 26 70 40 Q40 68 10 40Z" fill="#E2626B"/><path d="M10 40 Q40 47 70 40"/><path d="M22 41 Q40 50 58 41 Q40 44 22 41Z" fill="#fff" stroke="none"/>`),
  ear:()=>G(`<path d="M34 10 Q64 8 64 38 Q64 64 44 70 Q32 72 31 63 Q31 54 39 50 Q47 44 45 33 Q42 26 33 28 Q24 28 24 20 Q25 11 34 10Z" fill="${SK}"/><path d="M36 19 Q54 18 54 38 Q54 50 47 55"/>`),

function num(n){
  const cols=['#C2185B','#D98E04','#1F7A5A','#2B6CB0','#D9531E'];
  let s=`<text x="40" y="36" text-anchor="middle" font-size="30" font-weight="800" font-family="Baloo 2, sans-serif" style="fill:var(--ink)" stroke="none">${n}</text>`;
  for(let i=0;i<n;i++){const row=i<5?0:1,col=i%5;s+=`<circle cx="${16+col*12}" cy="${52+row*13}" r="4.6" fill="${cols[col]}" stroke="none"/>`}
  return G(s);
}
const blob=c=>G(`<path d="M40 10 C59 10 70 25 67 42 C64 61 52 70 37 69 C21 68 10 56 12 39 C14 22 24 10 40 10Z" fill="${c}"/>`);
function icon(k){
  if(k.startsWith('num:')) return num(+k.slice(4));
  if(k.startsWith('col:')) return blob(k.slice(4));
  if(k.startsWith('p:')){const n=k.slice(2);return G(place(person(P[n]),40,(n==='girl'||n==='boy')?.78:1))}
  return (IC[k]||IC.star)();
}
function nanduti(colorVar,label,size=100,multi=false){
  const thr=['var(--t1)','var(--t2)','var(--t3)','var(--t4)','var(--t5)'];
  let s=`<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true" class="${multi?'big-nanduti':''}">`;
  const N=16;
  for(let i=0;i<N;i++){const a=i*2*Math.PI/N;s+=`<line x1="50" y1="50" x2="${(50+46*Math.cos(a)).toFixed(1)}" y2="${(50+46*Math.sin(a)).toFixed(1)}" style="stroke:${multi?thr[i%5]:colorVar};stroke-width:1.4"/>`}
  [16,28,40].forEach((r,j)=>{s+=`<circle cx="50" cy="50" r="${r}" fill="none" style="stroke:${multi?thr[(j+1)%5]:colorVar};stroke-width:${j===2?2.4:1.6};stroke-dasharray:${j===1?'3 3':'none'}"/>`});
  for(let i=0;i<N;i++){const a=(i+.5)*2*Math.PI/N;s+=`<circle cx="${(50+44*Math.cos(a)).toFixed(1)}" cy="${(50+44*Math.sin(a)).toFixed(1)}" r="3.2" style="fill:${multi?thr[i%5]:colorVar}"/>`}
  for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=`<ellipse cx="${(50+22*Math.cos(a)).toFixed(1)}" cy="${(50+22*Math.sin(a)).toFixed(1)}" rx="5" ry="2.6" transform="rotate(${i*45} ${(50+22*Math.cos(a)).toFixed(1)} ${(50+22*Math.sin(a)).toFixed(1)})" style="fill:${multi?thr[(i+2)%5]:colorVar};opacity:.75"/>`}
  s+=`<circle cx="50" cy="50" r="12" style="fill:var(--card);stroke:${multi?thr[0]:colorVar};stroke-width:2"/>`;
  if(label) s+=`<text x="50" y="57" text-anchor="middle" font-size="18" font-weight="800" font-family="Baloo 2, sans-serif" style="fill:${colorVar}">${label}</text>`;
  return s+'</svg>';
}

function streak(list=mine()){
  const days=new Set(list.map(s=>s.day));let d=new Date();d.setHours(12,0,0,0);
  if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  let n=0;while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n;
}

    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
      const t=actx.currentTime+i*.12;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.2)});
  }catch(e){}
}

/* ---------- Palabras difíciles (repetición espaciada) ---------- */
function wordStrength(){
  const st={},last={};
  mine().slice().sort((a,b)=>a.ts-b.ts).forEach(s=>{
    (s.mistakes||[]).forEach(w=>{st[w]=(st[w]||0)+2;last[w]=s.ts});
    (s.ok||[]).forEach(w=>{if(st[w])st[w]=Math.max(0,st[w]-1)});
  });
  return Object.keys(st).filter(w=>st[w]>0&&ALLITEMS.has(w)).sort((a,b)=>st[b]-st[a]||last[b]-last[a]).map(w=>({w,score:st[w]}));
}
function learnedPool(){
  const ids=NODES.filter(n=>n.kind==='unit'&&doneCount(n.id)>0).map(n=>n.id);
  const m=new Map();
  ids.forEach(id=>UBY[id].items.forEach(it=>{if(!m.has(it[0])&&![...m.values()].some(x=>x[1]===it[1]))m.set(it[0],it)}));
  return [...m.values()];
}
function reviewUnit(){
  const weak=wordStrength().slice(0,8).map(x=>ALLITEMS.get(x.w));
  const pool=weak.slice();
  shuffle(learnedPool()).forEach(it=>{if(pool.length<12&&!pool.some(x=>x[0]===it[0]||x[1]===it[1]))pool.push(it)});
  return {id:'rev',kind:'rev',es:'Palabras difíciles',gn:"Jahecha jey!",items:pool,focus:weak.map(x=>x[0])};
}

/* Letras del guaraní: los dígrafos cuentan como una sola letra */
function graphemes(w){return (String(w).normalize('NFC').toLowerCase().match(/ch|mb|nd|ng|nt|rr|g̃|[^\s]/gu)||[])}
const ALPHA=["a","e","i","o","u","y","ã","ẽ","ĩ","õ","ũ","ỹ","ch","g","h","j","k","l","m","mb","n","nd","ñ","p","r","s","t","v","'"];
const spellable=it=>!/\s/.test(it[0].trim())&&graphemes(it[0]).length>=2&&graphemes(it[0]).length<=10;

function buildExercises(u){
  const items=u.items, miss=missMap(u.id);
  const level=u.kind==='unit'?Math.min(2,doneCount(u.id)):2;
  const focus=new Set(u.focus||[]);
  const weakSet=new Set(wordStrength().map(x=>x.w));
  const weighted=shuffle(items).sort((a,b)=>((focus.has(b[0])?5:0)+(miss[b[0]]||0)+(weakSet.has(b[0])?1:0))-((focus.has(a[0])?5:0)+(miss[a[0]]||0)+(weakSet.has(a[0])?1:0)));
  const n=u.kind==='unit'?7:9;
  const targets=[];let k=0;while(targets.length<n){targets.push(weighted[k%weighted.length]);k++}
  const phrases=items.filter(it=>it[0].trim().split(/\s+/).length>=2);
  const TYPES=[['pic','es2gn','gn2es','tf','pic','es2gn','gn2es'],
               ['pic','es2gn','spell','gn2es','es2gn','tf','spell'],
               ['es2gn','spell','es2gn','spell','gn2es','es2gn','spell','pic','gn2es']];
  const types=TYPES[level];
  const ex=[];
  targets.forEach((t,j)=>{
    let ty=types[j%types.length];
    if(ty==='spell'&&!spellable(t)) ty='es2gn';
    if(ty==='pic'){const ok=items.filter(x=>x[3]!==t[3]);if(new Set(ok.map(x=>x[3])).size<3) ty='es2gn'}
    ex.push({ty,t});
  });
  ex.splice(3,0,{ty:'match',set:pick(items.filter((x,ix,a)=>a.findIndex(y=>y[1]===x[1])===ix&&a.findIndex(y=>y[0]===x[0])===ix),4)});
  if(u.pairs) ex.splice(2,0,{ty:'opp',pair:pick(u.pairs,1)[0]});
  pick(phrases,Math.min(2,phrases.length)).forEach((p,j)=>ex.splice(5+j*2,0,{ty:'build',t:p}));
  return ex.slice(0,u.kind==='unit'?10:12).map((e,ix)=>Object.assign(e,{key:ix}));
}
function beginExercises(i){beginCustom(NODES[i])}
function beginCustom(u){
  L={u,queue:buildExercises(u),pos:0,base:0,firstWrong:new Set(),retried:new Set(),mistakes:new Set(),okWords:new Set(),t0:Date.now(),doneOk:0,player:current};
  L.base=L.queue.length;
  setLayer(`<div class="screen" role="dialog" aria-label="Lección">

}
let quitArmed=0;
function confirmQuit(){if(Date.now()-quitArmed<3000)return true;quitArmed=Date.now();toast('Tocá la X otra vez para salir');return false}

function showEx(){
  setProgress();
  if(L.pos>=L.queue.length) return finish();
  const e=L.queue[L.pos], u=L.u, box=$('#ex');
  let check=null;
  const ask=t=>`<div class="ask">${mascot()}<p class="say">${t}</p></div>`;
  const opts3=(t,f,n=3)=>{const others=pick(u.items.filter(x=>x[0]!==t[0]&&x[1]!==t[1]).filter((x,ix,a)=>a.findIndex(y=>f(y)===f(x))===ix),n-1);return shuffle([t,...others])};
  if(e.ty==='pic'){
    const others=[];shuffle(u.items).forEach(x=>{if(x[3]!==e.t[3]&&!others.some(o=>o[3]===x[3])&&others.length<3)others.push(x)});

    check=sel=>({ok:o[sel]===e.t,ans:`${e.t[0]} = ${e.t[1]}`});
  } else if(e.ty==='es2gn'){
    const o=opts3(e.t,x=>x[0]);
    box.innerHTML=`<p class="kind">¿Cómo se dice en guaraní?</p><div class="hero-pic">${icon(e.t[3])}</div>${ask(`<b>${e.t[1]}</b>`)}
      <div class="choices">${o.map((x,k)=>`<button type="button" class="ch g" data-k="${k}"><span class="k">${k+1}</span>${x[0]}</button>`).join('')}</div>`;
    check=sel=>({ok:o[sel]===e.t,ans:e.t[0]});
  } else if(e.ty==='gn2es'){
    const o=opts3(e.t,x=>x[1]);
    box.innerHTML=`<p class="kind">¿Qué quiere decir?</p>${ask(`<b class="gn">${e.t[0]}</b>`)}
      <div class="choices">${o.map((x,k)=>`<button type="button" class="ch" data-k="${k}"><span class="k">${k+1}</span>${x[1]}</button>`).join('')}</div>`;
    check=sel=>({ok:o[sel]===e.t,ans:e.t[1]});
  } else if(e.ty==='tf'){
    const truth=Math.random()<.5;
    const shown=truth?e.t:pick(u.items.filter(x=>x[3]!==e.t[3]&&x[0]!==e.t[0]&&x[1]!==e.t[1]),1)[0]||e.t;
    const isTrue=shown===e.t;
    box.innerHTML=`<p class="kind">¿Es correcto?</p><div class="hero-pic">${icon(e.t[3])}</div>${ask(`¿Esto es <b class="gn">${shown[0]}</b>?`)}
      <div class="choices pics"><button type="button" class="ch g" data-k="0" style="flex-direction:row"><span class="k">1</span>Hẽe · Sí</button><button type="button" class="ch g" data-k="1" style="flex-direction:row"><span class="k">2</span>Nahániri · No</button></div>`;
    check=sel=>({ok:(sel===0)===isTrue,ans:`El dibujo es ${e.t[0]} (${e.t[1]})`});
  } else if(e.ty==='build'){
    const words=e.t[0].split(/\s+/);
    const extra=pick(u.items.flatMap(x=>x[0].split(/\s+/)).filter(w=>!words.some(v=>norm(v)===norm(w))).filter((w,ix,a)=>a.indexOf(w)===ix),2);
    const bank=shuffle(words.concat(extra).map((w,k)=>({w,k})));
    const line=[];
    box.innerHTML=`<p class="kind">Armá la frase en guaraní</p><div class="hero-pic">${icon(e.t[3])}</div>${ask(`<b>${e.t[1]}</b>`)}
      <div class="build-line" id="bline" aria-label="Tu respuesta"></div><div class="bank" id="bank">${bank.map((b,ix)=>`<button type="button" class="tile" data-b="${ix}">${b.w}</button>`).join('')}</div>`;
    const draw=()=>{$('#bline').innerHTML=line.map((ix,p)=>`<button type="button" class="tile" data-l="${p}">${bank[ix].w}</button>`).join('');
      box.querySelectorAll('#bank .tile').forEach(t=>t.classList.toggle('used',line.includes(+t.dataset.b)));
      $('#chk').disabled=line.length===0};
    box.querySelector('#bank').onclick=ev=>{const t=ev.target.closest('.tile');if(!t||L.locked)return;const ix=+t.dataset.b;if(!line.includes(ix)){line.push(ix);draw()}};
    box.querySelector('#bline').onclick=ev=>{const t=ev.target.closest('.tile');if(!t||L.locked)return;line.splice(+t.dataset.l,1);draw()};
    L.locked=false;
    footCheck(()=>({ok:norm(line.map(ix=>bank[ix].w).join(' '))===norm(e.t[0]),ans:e.t[0]}));
    return;
  } else if(e.ty==='spell'){
    const word=graphemes(e.t[0]);
    const extra=pick(ALPHA.filter(x=>!word.includes(x)),2);
    const bank=shuffle(word.concat(extra).map((w,k)=>({w,k})));
    const line=[];
    box.innerHTML=`<p class="kind">Escribí la palabra en guaraní</p><div class="hero-pic">${icon(e.t[3])}</div>${ask(`<b>${e.t[1]}</b>`)}
      <div class="build-line letters" id="bline" aria-label="Tu respuesta"></div><div class="bank letters" id="bank">${bank.map((b,ix)=>`<button type="button" class="tile" data-b="${ix}">${b.w}</button>`).join('')}</div>`;
    const draw=()=>{$('#bline').innerHTML=line.map((ix,p)=>`<button type="button" class="tile" data-l="${p}">${bank[ix].w}</button>`).join('');
      box.querySelectorAll('#bank .tile').forEach(t=>t.classList.toggle('used',line.includes(+t.dataset.b)));
      $('#chk').disabled=line.length===0};
    box.querySelector('#bank').onclick=ev=>{const t=ev.target.closest('.tile');if(!t||L.locked)return;const ix=+t.dataset.b;if(!line.includes(ix)){line.push(ix);draw()}};
    box.querySelector('#bline').onclick=ev=>{const t=ev.target.closest('.tile');if(!t||L.locked)return;line.splice(+t.dataset.l,1);draw()};
    L.locked=false;
    footCheck(()=>({ok:line.map(ix=>bank[ix].w).join('')===word.join(''),ans:e.t[0]}));
    return;
  } else if(e.ty==='opp'){
    const askW=Math.random()<.5?0:1, q=e.pair[askW], a=e.pair[1-askW];
    const qi=ALLITEMS.get(q); e.t=ALLITEMS.get(a);
    const o=shuffle([a,...pick(u.items.map(x=>x[0]).filter(w=>w!==a&&w!==q),2)]);
    box.innerHTML=`<p class="kind">Buscá el opuesto</p><div class="hero-pic">${icon(qi[3])}</div>${ask(`¿Cuál es lo contrario de <b class="gn">${q}</b> (${qi[1]})?`)}

      <div class="match"><div class="col">${left.map(x=>`<button type="button" class="ch g" data-m="l" data-i="${e.set.indexOf(x)}">${x[0]}</button>`).join('')}</div>

    let selL=null,selR=null,found=0,wrong=false;

      const b=ev.target.closest('.ch');if(!b||b.disabled)return;
      const side=b.dataset.m;
      box.querySelectorAll(`[data-m="${side}"]`).forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');if(side==='l')selL=b;else selR=b;
      if(selL&&selR){
        if(selL.dataset.i===selR.dataset.i){[selL,selR].forEach(x=>{x.classList.remove('sel');x.classList.add('right');x.disabled=true;setTimeout(()=>x.classList.add('gone'),350)});found++;beep(true)}
        else{wrong=true;const a=selL,c=selR;[a,c].forEach(x=>{x.classList.remove('sel');x.classList.add('wrong')});setTimeout(()=>[a,c].forEach(x=>x.classList.remove('wrong')),500);beep(false);
          L.mistakes.add(e.set[+a.dataset.i][0])}
        selL=selR=null;
        if(found===e.set.length) resolve(!wrong,'',true);
      }
    };
    return;
  }
  let sel=null;
  box.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{if(L.locked)return;box.querySelectorAll('.ch').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.k;$('#chk').disabled=false});
  L.locked=false;
  footCheck(()=>{const r=check(sel);const btns=box.querySelectorAll('.ch');btns.forEach(x=>x.disabled=true);
    const s=btns[sel];if(s){s.classList.remove('sel');s.classList.add(r.ok?'right':'wrong')}
    if(!r.ok&&e.ty!=='tf'){btns.forEach(x=>{const k=+x.dataset.k;if(check(k).ok)x.classList.add('right')})}
    return r});
}
function footCheck(fn){
  setFoot('',`<button class="big" type="button" id="chk" disabled>Comprobar</button>`);
  $('#chk').onclick=()=>{L.locked=true;const r=fn();resolve(r.ok,r.ans)};

function resolve(ok,ans,isMatch){
  const e=L.queue[L.pos];
  if(!ok){
    if(!L.retried.has(e.key)){L.firstWrong.add(e.key);if(e.t)L.mistakes.add(e.t[0]);
      if(!isMatch){L.queue.push(Object.assign({},e,{retry:true}));L.retried.add(e.key)}}
  }
  if(ok||isMatch) L.doneOk++;
  if(ok&&!L.retried.has(e.key)){if(e.t)L.okWords.add(e.t[0]);if(isMatch)e.set.forEach(x=>L.okWords.add(x[0]))}
  beep(ok);
  const pr=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  if(ok) setFoot('ok',`<div class="fbtxt"><h3>${pr[0]}</h3><p>${pr[1]}</p></div><button class="big" type="button" id="cont">Continuar</button>`);
  else if(isMatch) setFoot('ok',`<div class="fbtxt"><h3>¡Listo!</h3><p>Encontraste todas las parejas.</p></div><button class="big" type="button" id="cont">Continuar</button>`);
  else setFoot('bad',`<div class="fbtxt"><h3>Casi…</h3><p>La respuesta es: <span class="gn">${esc(ans)}</span></p>${L.retried.has(e.key)&&!e.retry?'<p class="muted" style="font-size:.9rem">Te la vuelvo a preguntar al final.</p>':''}</div><button class="big red" type="button" id="cont">Entendido</button>`);
  setProgress();
  const c=$('#cont');c.focus({preventScroll:true});
  c.onclick=()=>{L.pos++;showEx()};
}

    ${after>before?`<p style="font-weight:800">${UI.flame(true).replace('<svg','<svg style="width:22px;height:22px;vertical-align:-4px"')} ¡Racha de ${after} ${after===1?'día':'días'}!</p>`:''}
    ${s.mistakes.length?`<p class="muted">Para repasar: <span class="gn" style="color:var(--accent)">${s.mistakes.map(esc).join(', ')}</span></p>`:''}

  $('#pbar').style.width='100%';

/* ---------- Juegos ---------- */
let G0=null;
function gamePool(n,filter){
  const weak=new Set(wordStrength().map(x=>x.w));
  let pool=learnedPool().filter(filter||(()=>true));
  pool=shuffle(pool).sort((a,b)=>(weak.has(b[0])?1:0)-(weak.has(a[0])?1:0));
  const out=[];pool.forEach(it=>{if(out.length<n&&!out.some(x=>x[3]===it[3]||x[1]===it[1]))out.push(it)});
  return out;
}
function gameShell(g,inner){

    <div class="lbody pad"><div class="lbody-in" id="gbody">${inner}</div></div></div>`,'lesson');
  $('#lx').onclick=()=>{if(confirmQuit()){stopGame();closeLayer()}};
}
function stopGame(){if(G0&&G0.raf)cancelAnimationFrame(G0.raf);if(G0&&G0.timer)clearInterval(G0.timer);if(G0)G0.over=true}

function endGame(g,{score,total,correct,xp,mistakes=[],ok=[],label}){

    <h2>${score>=best&&score>0?'¡Nuevo récord!':'¡Bien jugado!'}</h2>

    <div class="rstats">

function startGame(id){

/* 1. Memoria del ñandutí: parejas de dibujo y palabra */
function gameMemory(g){
  const items=gamePool(6);
  const cards=shuffle(items.flatMap((it,k)=>[{k,face:'pic',it},{k,face:'word',it}]));
  gameShell(g,`<p class="ghelp">Dá vuelta dos tarjetas. Si el dibujo y la palabra van juntos, ¡quedan!</p>
    <div class="mgrid">${cards.map((c,i)=>`<button type="button" class="mcard" data-i="${i}" aria-label="Tarjeta ${i+1}">
      <span class="back">${nanduti('var(--t1)','',64,true).replace('class="big-nanduti"','class="nd"')}</span>
      <span class="front">${c.face==='pic'?icon(c.it[3]):`<b class="gn">${c.it[0]}</b>`}<small>${c.face==='pic'?'':c.it[1]}</small></span></button>`).join('')}</div>`);
  let open=[],found=0,moves=0,busy=false;
  const stat=()=>{$('#gstat').textContent=`${found}/${items.length} · ${moves} intentos`};stat();
  $('#gbody').querySelector('.mgrid').onclick=e=>{
    const b=e.target.closest('.mcard');if(!b||busy||b.classList.contains('up'))return;
    b.classList.add('up');open.push(b);
    if(open.length<2) return;
    moves++;const [x,y]=open.map(o=>cards[+o.dataset.i]);
    if(x.k===y.k&&x.face!==y.face){
      open.forEach(o=>o.classList.add('done'));open=[];found++;beep(true);toast(`${x.it[0]} = ${x.it[1]}`);stat();
      if(found===items.length) setTimeout(()=>endGame(g,{score:Math.max(1,18-moves),total:moves,correct:items.length,xp:5+Math.max(0,10-Math.max(0,moves-6)),label:'Puntos'}),700);
    } else {
      busy=true;beep(false);stat();
      setTimeout(()=>{open.forEach(o=>o.classList.remove('up'));open=[];busy=false},950);
    }
  };
}

/* 2. Lluvia de palabras: tocá la gota correcta antes de que llegue al suelo */
function gameRain(g){
  const pool=gamePool(12);
  gameShell(g,`<div class="rain" id="sky" aria-live="polite"></div>
    <div class="rprompt" id="rprompt"></div>`);
  const sky=$('#sky');let score=0,miss=0,wrong=0,speed=55,round=null;const mistakes=[],ok=[];
  const DURATION=60;let left=DURATION;
  const stat=()=>{$('#gstat').textContent=`⏱ ${left}s · ${score} puntos`};
  G0.timer=setInterval(()=>{left--;stat();if(left<=0)finish()},1000);stat();
  function finish(){if(G0.over)return;endGame(g,{score,total:score+miss+wrong,correct:score,xp:Math.min(15,3+score),mistakes,ok,label:'Gotas'})}
  function next(){
    if(G0.over) return;
    sky.innerHTML='';
    const t=pool[Math.floor(Math.random()*pool.length)];
    const opts=shuffle([t,...pick(pool.filter(x=>x!==t&&x[0]!==t[0]&&x[1]!==t[1]),2)]);
    $('#rprompt').innerHTML=`${icon(t[3])}<div style="min-width:0"><small>¿Cuál es…?</small><b>${t[1]}</b></div>`;
    const lanes=shuffle([0,1,2]);
    round={t,y:opts.map((_,i)=>-60-i*45-Math.random()*30),drops:[]};
    opts.forEach((o,i)=>{const d=document.createElement('button');d.type='button';d.className='drop';d.style.left=(3+lanes[i]*33)+'%';
      d.innerHTML=`<span class="gn${o[0].length>9?' long':''}">${o[0]}</span>`;d.onclick=()=>hit(d,o);sky.appendChild(d);round.drops.push({d,o,i})});
  }
  function hit(d,o){
    if(!round||d.disabled) return;
    if(o===round.t){score++;ok.push(o[0]);speed=Math.min(150,speed+7);beep(true);d.classList.add('pop');round=null;stat();setTimeout(next,350)}
    else{wrong++;mistakes.push(round.t[0]);beep(false);d.classList.add('bad');d.disabled=true}
  }
  let last=performance.now();
  function frame(now){
    if(G0.over) return;
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(round){
      const H=sky.clientHeight;
      round.drops.forEach(x=>{round.y[x.i]+=speed*dt;x.d.style.transform=`translateY(${round.y[x.i]}px)`});
      const correct=round.drops.find(x=>x.o===round.t);
      if(correct&&round.y[correct.i]>H-50){miss++;mistakes.push(round.t[0]);beep(false);correct.d.classList.add('missed');
        toast(`Era ${round.t[0]}`);round=null;setTimeout(next,700)}
    }
    G0.raf=requestAnimationFrame(frame);
  }
  next();G0.raf=requestAnimationFrame(frame);
}

/* 3. Letra por letra: armá la palabra; un error muestra una pista */
function gameLetters(g){
  const words=gamePool(6,spellable);
  let w=0,errors=0,total=0;const mistakes=[],ok=[];
  gameShell(g,`<div id="lbox"></div>`);
  function show(){
    if(w>=words.length){endGame(g,{score:ok.length,total:words.length,correct:ok.length,xp:5+ok.length,mistakes,ok,label:'Sin errores'});return}
    const it=words[w],word=graphemes(it[0]);let pos=0,err=0;
    const bank=shuffle(word.concat(pick(ALPHA.filter(x=>!word.includes(x)),3)).map((x,k)=>({x,k})));
    $('#gstat').textContent=`${w+1} de ${words.length}`;
    $('#lbox').innerHTML=`<div class="hero-pic">${icon(it[3])}</div><p class="kind" style="text-align:center">${it[1]}</p>
      <div class="slots">${word.map(()=>'<span class="slot"></span>').join('')}</div>
      <div class="bank letters" id="lbank">${bank.map((b,i)=>`<button type="button" class="tile" data-i="${i}">${b.x}</button>`).join('')}</div>
      <p class="err" id="lmsg" aria-live="polite"></p>`;
    const slots=[...document.querySelectorAll('.slot')];
    $('#lbank').onclick=e=>{
      const b=e.target.closest('.tile');if(!b||b.classList.contains('used'))return;
      const x=bank[+b.dataset.i].x;
      if(x===word[pos]){b.classList.add('used');slots[pos].textContent=x;slots[pos].classList.add('ok');pos++;
        if(pos===word.length){beep(true);(err?mistakes:ok).push(it[0]);if(err)errors++;total++;
          $('#lmsg').className='okmsg';$('#lmsg').innerHTML=`<span class="gn">${it[0]}</span> = ${it[1]}`;w++;setTimeout(show,1100)}}
      else{err++;beep(false);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);
        $('#lmsg').textContent=err>=2?'Pista: buscá la letra que brilla.':'Esa no va ahí. Probá otra.';
        if(err>=2){const h=[...$('#lbank').querySelectorAll('.tile')].find(t=>!t.classList.contains('used')&&bank[+t.dataset.i].x===word[pos]);if(h)h.classList.add('hint')}}
    };
  }
  show();
}

/* 4. ¡Pya'e! Verdadero o falso contra reloj */
function gameFast(g){
  const pool=gamePool(14);
  let score=0,streakN=0,answered=0,cur=null;const mistakes=[],ok=[];
  const DURATION=45;let left=DURATION;
  gameShell(g,`<div class="fast"><div class="hero-pic" id="fpic"></div><p class="fword" id="fword"></p><p class="fbonus" id="fbonus"></p>
    <div class="fbtns"><button type="button" class="big" id="fy">Hẽe · Sí</button><button type="button" class="big red" id="fn">Nahániri · No</button></div></div>`);
  const stat=()=>{$('#gstat').textContent=`⏱ ${left}s · ${score} puntos`};
  G0.timer=setInterval(()=>{left--;stat();if(left<=0)endGame(g,{score,total:answered,correct:ok.length,xp:Math.min(15,3+Math.round(score/2)),mistakes,ok,label:'Puntos'})},1000);stat();
  function next(){
    const t=pool[Math.floor(Math.random()*pool.length)];
    const truth=Math.random()<.5;
    const shown=truth?t:pick(pool.filter(x=>x[3]!==t[3]&&x[0]!==t[0]&&x[1]!==t[1]),1)[0]||t;
    cur={t,isTrue:shown===t};
    $('#fpic').innerHTML=icon(t[3]);$('#fword').innerHTML=`<span class="gn">${shown[0]}</span>`;
  }
  function answer(yes){
    if(G0.over||!cur) return;
    answered++;
    const right=yes===cur.isTrue;
    if(right){streakN++;const pts=streakN>=5?2:1;score+=pts;ok.push(cur.t[0]);beep(true);$('#fbonus').textContent=streakN>=5?`¡Racha de ${streakN}! ×2`:''}
    else{streakN=0;mistakes.push(cur.t[0]);beep(false);$('#fbonus').textContent=`Era ${cur.t[0]} (${cur.t[1]})`}
    const f=$('.fast');f.classList.remove('flash-ok','flash-bad');void f.offsetWidth;f.classList.add(right?'flash-ok':'flash-bad');
    stat();next();
  }
  $('#fy').onclick=()=>answer(true);$('#fn').onclick=()=>answer(false);
  next();
}

function fmtDate(ts){const d=new Date(ts);return d.toLocaleDateString('es-PY',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'})}
const famList=()=>famFilter==='all'?sessions:sessions.filter(s=>ownerOf(s)===famFilter);
function chart14(list){
  const days=[];const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-13);
  for(let i=0;i<14;i++){const k=dayKey(d);days.push({k,label:d.getDate(),wd:'DLMMJVS'[d.getDay()],xp:list.filter(s=>s.day===k).reduce((a,s)=>a+s.xp,0)});d.setDate(d.getDate()+1)}
  const max=Math.max(DAILY_GOAL,...days.map(x=>x.xp));const top=Math.ceil(max/10)*10;
  const W=640,H=220,l=34,r=10,t=14,b=40,cw=(W-l-r)/14;

  [0,top/2,top].forEach(v=>{s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${v}</text>`});
  s+=`<line x1="${l}" x2="${W-r}" y1="${y(DAILY_GOAL)}" y2="${y(DAILY_GOAL)}" style="stroke:var(--gold);stroke-dasharray:5 4;stroke-width:1.5"/><text x="${l+4}" y="${y(DAILY_GOAL)-5}" text-anchor="start" font-size="11" font-weight="700" style="fill:var(--gold-d)">meta ${DAILY_GOAL}</text>`;
  days.forEach((x,i)=>{const cx=l+i*cw+cw/2,bw=cw*.62;

      <div class="panel"><h3>Repasos y juegos</h3><div class="tw"><table><thead><tr><th></th><th>Actividad</th><th>Veces</th><th>Aciertos</th><th>Última vez</th><th>Estado</th></tr></thead><tbody>${extraRows(list)}</tbody></table></div></div>
      <div class="panel"><h3>Palabras para repasar juntos</h3>${hw.length?`<div class="words">${hw.map(([w,n])=>`<span class="wchip"><span class="gn">${esc(w)}</span> · ${esc(all[w]||'')} <small>(${n} ${n===1?'error':'errores'})</small></span>`).join('')}</div>`:'<p class="muted">Sin errores registrados todavía.</p>'}</div>
      <div class="panel"><h3>Últimas lecciones y juegos</h3>${hist.length?`<div class="tw"><table><thead><tr><th>Fecha</th>${multi?'<th>Jugador</th>':''}<th>Nivel</th><th>Aciertos</th><th>XP</th><th>Tiempo</th></tr></thead><tbody>${hist.map(s=>`<tr><td>${fmtDate(s.ts)}</td>${multi?`<td>${esc(pName(ownerOf(s)))}</td>`:''}<td>${esc(uname(s.unit))}</td><td class="n">${s.correct}/${s.total}</td><td class="n">+${s.xp}</td><td class="n">${Math.floor(s.seconds/60)}:${String(s.seconds%60).padStart(2,'0')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Sin lecciones todavía.</p>'}</div>
      <div class="panel"><h3>Ingresos</h3><p class="muted" style="margin-bottom:8px">Cada vez que un estudiante se registra o entra con su nombre y sus animales.</p>${lg.length?`<div class="tw"><table><thead><tr><th>Fecha</th><th>Perfil</th><th>Resultado</th></tr></thead><tbody>${lg.map(x=>`<tr><td>${fmtDate(x.ts)}</td><td>${esc(x.name||pName(x.p))}</td><td>${x.kind==='noname'?'<span class="pill none">Nombre no registrado</span>':x.kind==='registro'?'<span class="pill prac">Se registró</span>':x.ok?'<span class="pill dom">Entró</span>':'<span class="pill low">Animales equivocados</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Sin ingresos todavía.</p>'}</div>
      ${API&&(settings.serverVersion||1)<2?`<div class="panel alert"><b>Actualizá el servidor de la planilla</b> para que el repaso de palabras difíciles recuerde lo que ya aprendió y para poder cerrar los registros.
        <ol style="margin:8px 0 0;padding-left:20px"><li>En la planilla: <b>Extensiones → Apps Script</b>.</li><li>Borrá todo, pegá el archivo <b>servidor-google.gs</b> nuevo del repositorio y tocá <b>Guardar</b>.</li><li><b>Implementar → Gestionar implementaciones → ✏️ → Versión: Nueva versión → Implementar</b>. La dirección no cambia.</li></ol></div>`:''}
      <div class="panel"><h3>Jugadores</h3>
        <label class="check" style="margin-bottom:10px"><input type="checkbox" id="regT" ${settings.allowReg!==false?'checked':''}><span>Permitir que estudiantes nuevos se registren solos desde la pantalla de inicio</span></label>
        ${players().length?'':'<p class="muted">Todavía no hay estudiantes. Se registran desde la pantalla de inicio con <b>Soy estudiante → Registrarme</b>, o podés agregarlos vos.</p>'}
        <div class="plrows">${players().map(p=>`<div class="plrow">${ava(p.avatar,'cava2')}<b style="min-width:0">${esc(p.name)}</b><span class="muted">${sessions.filter(s=>ownerOf(s)===p.id).length} lecciones${p.created?' · desde '+new Date(p.created).toLocaleDateString('es-PY',{day:'numeric',month:'short'}):''}</span>
          <span class="row" style="margin-left:auto"><button class="smallbtn" type="button" data-edit="${p.id}">Cambiar nombre o animales</button><button class="smallbtn danger" type="button" data-del="${p.id}">Quitar</button></span></div>`).join('')}</div>
        <div class="row" style="margin-top:12px"><button class="smallbtn" type="button" id="addP">Agregar jugador</button><button class="smallbtn" type="button" id="pinB">Cambiar PIN</button></div>
        <form id="pinF" class="row" hidden style="margin-top:10px"><label class="field"><span>PIN nuevo</span><input id="np1" inputmode="numeric" maxlength="4" type="password" autocomplete="off"></label><label class="field"><span>Repetir</span><input id="np2" inputmode="numeric" maxlength="4" type="password" autocomplete="off"></label><button class="smallbtn" type="submit">Guardar PIN</button></form>
        <p id="delAsk" hidden style="margin-top:10px"></p>
      </div>
      <div class="panel"><h3>Recibir los resultados</h3>
        <div class="sendgrid">
          <div class="sendbox"><h4>${UI.chat()} Por WhatsApp</h4>
            <p class="muted">Escribí tu número con el código de país, por ejemplo 595981123456.</p>
            <form class="row" id="waF" style="margin-top:8px"><label class="field"><span>Número</span><input id="waIn" inputmode="tel" value="${esc(settings.waNumber||'')}" placeholder="595981123456" style="width:170px"></label><button class="smallbtn" type="submit">Guardar</button></form>
            <label class="check"><input type="checkbox" id="kidS" ${settings.kidShare!==false?'checked':''}><span>Al terminar cada lección, mostrar el botón <b>Contale a tu familia</b></span></label>
            <a class="wa" id="waSend" target="_blank" rel="noopener" href="${waLink(report(list))}">${UI.chat()} Enviar este informe por WhatsApp</a>
            ${waDigits()?'':'<p class="muted" style="font-size:.85rem">Sin número guardado, WhatsApp te deja elegir a quién mandarlo.</p>'}
          </div>
          <div class="sendbox"><h4>Base de datos</h4>
            ${storeMode==='server'?'<p><span class="pill dom">Conectada</span></p><p class="muted">Todos los estudiantes, lecciones e ingresos se guardan en tu planilla de Google. También podés abrirla directamente para ver cada fila.</p>':
              storeMode==='account'?'<p class="muted">Los resultados se guardan en tu cuenta de Claude.</p>':
              '<p><span class="pill low">Solo este dispositivo</span></p><p class="muted">Este navegador guarda sus propios datos. Para tener una sola base de datos para todos los dispositivos, conectá la planilla de Google siguiendo el README del repositorio.</p>'}
          </div>
        </div>
      </div>
      <div class="panel"><h3>Ajustes</h3>
        <div class="row">
          <button class="smallbtn" type="button" id="sndB">${UI.sound(soundOn).replace('<svg','<svg style="width:18px;height:18px;vertical-align:-3px"')} Sonido: ${soundOn?'sí':'no'}</button>
          <button class="smallbtn" type="button" id="copyB">Copiar informe</button>
          <button class="smallbtn danger" type="button" id="resetB">Borrar el progreso${famFilter==='all'?' de todos':' de '+esc(pName(famFilter))}</button>
          <span id="resetAsk" hidden><b>¿Seguro? No se puede deshacer.</b> <button class="smallbtn danger" type="button" id="resetYes">Sí, borrar</button> <button class="smallbtn" type="button" id="resetNo">Cancelar</button></span>
        </div>
        <p class="muted" style="margin-top:12px;font-size:.9rem">${storeMode==='server'?'Todos los estudiantes y resultados están en tu planilla de Google, sin importar desde qué dispositivo entren.':storeMode==='account'?'Los resultados se guardan en tu cuenta de Claude: los ves desde cualquier dispositivo donde abras esta página.':'Los resultados se guardan solo en este dispositivo y navegador. Para verlos, abrí este panel en el mismo dispositivo donde juega.'}</p>
        <textarea id="repT" hidden readonly style="width:100%;height:160px;margin-top:10px;font:inherit;font-size:.85rem"></textarea>
      </div>
    </div></div></div>`,'fam');
  const leaveFam=()=>{
    if(API){adminToken=null;if(!current){dropSession()}else{settings=Object.assign({},settings,{players:[current]});sessions=sessions.filter(x=>x.playerId===current.id);logins=[]}}
    if(current)closeLayer();else{screen=null;$('#layer').innerHTML='';renderAll()}};
  $('#lx').onclick=leaveFam;
  const fo=$('#famOut');if(fo)fo.onclick=leaveFam;
  const ch=$('#chips');if(ch)ch.onclick=e=>{const b=e.target.closest('.chip');if(b){famFilter=b.dataset.f;renderFamily()}};
  $('#sndB').onclick=()=>{soundOn=!soundOn;LS.set('gn-sound',soundOn);renderFamily()};
  $('#copyB').onclick=()=>{const r=report(list);
    const fallback=()=>{const ta=$('#repT');ta.hidden=false;ta.value=r;ta.select();toast('Seleccioná y copiá el texto')};
    try{navigator.clipboard.writeText(r).then(()=>toast('Informe copiado'),fallback)}catch(e){fallback()}};
  $('#resetB').onclick=()=>{$('#resetAsk').hidden=false};
  $('#resetNo').onclick=()=>{$('#resetAsk').hidden=true};
  $('#resetYes').onclick=async()=>{await resetProgress(famFilter);toast('Progreso borrado');renderFamily();renderTop()};
  $('#waF').onsubmit=async ev=>{ev.preventDefault();const v=$('#waIn').value.replace(/\D/g,'');
    if(v&&v.length<8){toast('Revisá el número: falta el código de país');return}
    if(API){await adminDo('adminSettings',{waNumber:v},v?'Número guardado':'Número borrado');return}
    settings=Object.assign({},settings,{waNumber:v});if(await saveSettings()){toast(v?'Número guardado':'Número borrado');renderFamily()}};
  $('#kidS').onchange=async ev=>{if(API){await adminDo('adminSettings',{kidShare:ev.target.checked});return}settings=Object.assign({},settings,{kidShare:ev.target.checked});await saveSettings()};
  const shF=$('#shF');if(shF)shF.onsubmit=async ev=>{ev.preventDefault();const v=$('#shIn').value.trim();
    if(v&&!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(v)){toast('Esa dirección no es de Apps Script. Tiene que terminar en /exec');return}
    settings=Object.assign({},settings,{sheetUrl:v});if(await saveSettings()){toast(v?'Planilla guardada':'Planilla desconectada');flushOutbox();renderFamily()}};
  const shT=$('#shTest');if(shT)shT.onclick=()=>{sendToSheet({type:'prueba',ts:Date.now(),player:'Prueba desde la app'});toast('Prueba enviada: revisá la planilla')};
  const cc=$('#codeCopy');if(cc)cc.onclick=()=>{const ta=$('#codeT');try{navigator.clipboard.writeText(GAS_CODE).then(()=>toast('Código copiado'),()=>{ta.select();toast('Seleccioná y copiá el texto')})}catch(e){ta.select()}};
  $('#regT').onchange=async ev=>{const v=ev.target.checked;
    if(API){await adminDo('adminSettings',{allowReg:v},v?'Registros abiertos':'Registros cerrados');return}
    settings=Object.assign({},settings,{allowReg:v});if(await saveSettings())toast(v?'Registros abiertos':'Registros cerrados')};
  $('#pinB').onclick=()=>{$('#pinF').hidden=false;$('#np1').focus()};
  $('#pinF').onsubmit=async ev=>{ev.preventDefault();const a=$('#np1').value,b=$('#np2').value;
    if(!/^\d{4}$/.test(a)){toast('El PIN tiene que tener 4 números');return}if(a!==b){toast('Los dos PIN no son iguales');return}
    if(API){await adminDo('adminSetPin',{pin:a},'PIN cambiado');return}
    settings=Object.assign({},settings,{pinHash:hash('pin:'+a)});if(await saveSettings()){toast('PIN cambiado');renderFamily()}};
  $('#addP').onclick=()=>playerForm({title:'Agregar jugador',back:()=>renderFamily(),
    onSave:async(p,_,seq)=>{if(API){await adminDo('adminAddPlayer',{name:p.name,avatar:p.avatar,seq},p.name+' ya puede entrar');return}
      settings=Object.assign({},settings,{players:players().concat([p])});if(await saveSettings()){toast(p.name+' ya puede entrar');renderFamily()}}});
  $('#layer').querySelector('.plrows').onclick=e=>{
    const ed=e.target.closest('[data-edit]'),dl=e.target.closest('[data-del]');
    if(ed){const p=players().find(x=>x.id===ed.dataset.edit);playerForm({title:'Cambiar '+p.name,player:p,back:()=>renderFamily(),
      onSave:async(np,_,seq)=>{if(API){await adminDo('adminUpdatePlayer',{id:np.id,name:np.name,avatar:np.avatar,seq:seq||undefined},'Guardado');return}
        settings=Object.assign({},settings,{players:players().map(x=>x.id===np.id?np:x)});if(current&&current.id===np.id)current=np;if(await saveSettings()){toast('Guardado');renderFamily()}}})}
    if(dl){const p=players().find(x=>x.id===dl.dataset.del);const box=$('#delAsk');box.hidden=false;
      box.innerHTML=`<b>¿Quitar a ${esc(p.name)}?</b> Sus lecciones quedan en el historial. <button class="smallbtn danger" type="button" id="delYes">Sí, quitar</button> <button class="smallbtn" type="button" id="delNo">Cancelar</button>`;
      $('#delNo').onclick=()=>{box.hidden=true};
      $('#delYes').onclick=async()=>{if(API){if(famFilter===p.id)famFilter='all';await adminDo('adminDeletePlayer',{id:p.id},'Quitado');return}
        settings=Object.assign({},settings,{players:players().filter(x=>x.id!==p.id)});if(current&&current.id===p.id)current=null;if(famFilter===p.id)famFilter='all';if(await saveSettings())renderFamily()}}
  };
}

/* ---------- Arranque ---------- */
renderAll();
connectDb().then(flushOutbox);
})();
</script>

</body>
</html>
