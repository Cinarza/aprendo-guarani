<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Jaguarete'i Guaraní</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: app de una columna; camino en zigzag de niveles, lecciones a pantalla completa, panel familiar aparte */
:root{
  --bg:#F3F6EC; --card:#FFFFFF; --ink:#1D2A23; --muted:#5A6C60; --line:#D6DFCB; --soft:#E8EFDD;
  --accent:#C2185B; --accent-d:#8E0F42; --ok:#2E9E52; --ok-d:#1F7038; --ok-bg:#DDF3E3;
  --bad:#D63B3B; --bad-d:#9C2525; --bad-bg:#FBE1E1; --gold:#E8A317; --gold-d:#B37A06; --lock:#B9C3B0;
  --t1:#C2185B; --t2:#D98E04; --t3:#1F7A5A; --t4:#2B6CB0; --t5:#D9531E;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13201A; --card:#1C2C24; --ink:#EEF4EA; --muted:#A6B8AB; --line:#30463A; --soft:#22362C;
  --accent:#F06292; --accent-d:#B23A66; --ok:#4CC27A; --ok-d:#2C8A50; --ok-bg:#1D3B28;
  --bad:#F07272; --bad-d:#B04545; --bad-bg:#40221F; --gold:#F2B63D; --gold-d:#B8831B; --lock:#3F5546;
  --t1:#F06292; --t2:#F2B63D; --t3:#5CC79A; --t4:#6FA8E8; --t5:#F2895A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13201A; --card:#1C2C24; --ink:#EEF4EA; --muted:#A6B8AB; --line:#30463A; --soft:#22362C;
  --accent:#F06292; --accent-d:#B23A66; --ok:#4CC27A; --ok-d:#2C8A50; --ok-bg:#1D3B28;
  --bad:#F07272; --bad-d:#B04545; --bad-bg:#40221F; --gold:#F2B63D; --gold-d:#B8831B; --lock:#3F5546;
  --t1:#F06292; --t2:#F2B63D; --t3:#5CC79A; --t4:#6FA8E8; --t5:#F2895A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
.gn{font-family:var(--display);font-weight:800}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--t4);outline-offset:2px}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:2px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--accent);margin-right:auto;min-width:0}
.brand svg{width:36px;height:36px;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){.brand span{display:none}}
.stat{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:800;font-size:1.1rem}
.stat svg{width:24px;height:24px}
.iconbtn{background:none;border:2px solid var(--line);border-radius:12px;padding:4px 10px;cursor:pointer;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:6px}
.iconbtn svg{width:18px;height:18px}

/* Inicio */
.home{max-width:640px;margin:0 auto;padding-block:16px 60px}
.hello{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px}
.hello .ill{width:64px;height:64px}
.hello h2{font-size:1.35rem}
.goal-bar{height:14px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:6px}
.goal-bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .4s}
.hello small{color:var(--muted);font-weight:700}

.unit{margin-top:26px}
.banner{border-radius:18px;padding:12px 16px;color:#fff;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner .eb{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.banner h3{font-size:1.35rem}
.banner .es{font-weight:700}
.banner button{flex:none;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6);color:#fff;border-radius:12px;padding:6px 10px;font-weight:800;cursor:pointer;font-size:.85rem}
.banner.locked{background:var(--lock)!important;color:var(--ink)}
.banner.locked button{display:none}
.nodewrap{display:flex;flex-direction:column;align-items:center;padding-block:48px 0;position:relative}
.node{width:84px;height:78px;border-radius:50%;border:0;cursor:pointer;position:relative;display:grid;place-items:center;transition:transform .1s}
.node svg{width:42px;height:42px}
.node:active{transform:translateY(5px)}
.node.locked{background:var(--lock);box-shadow:0 7px 0 color-mix(in srgb,var(--lock) 70%,#000);cursor:not-allowed}
.crowns{display:flex;gap:4px;margin-top:12px}
.crowns svg{width:20px;height:20px}
.tipbubble{position:absolute;top:4px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:2px 12px;font-family:var(--display);font-weight:800;color:var(--accent);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.tipbubble{animation:bob 1.4s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-5px)}}
.store-note{margin-top:30px;color:var(--muted);font-size:.85rem;text-align:center}

/* Pantallas superpuestas */
.screen{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fam-head{max-width:860px!important}.lhead{max-width:640px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:12px}
.close{background:none;border:0;cursor:pointer;padding:4px;color:var(--muted)}
.close svg{width:28px;height:28px}
.prog{flex:1;height:18px;background:var(--soft);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .35s}
.lbody{flex:1;overflow-y:auto;width:100%}
.lbody-in{max-width:640px;margin:0 auto;padding-block:10px 24px}
.ask{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:end;margin-bottom:18px}
.ask .mascot{width:70px;height:70px}
.say{background:var(--card);border:2px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;font-weight:700;font-size:1.1rem;min-width:0}
.say b.gn{color:var(--accent);font-size:1.25rem}
.kind{font-family:var(--display);font-weight:800;font-size:1.4rem;margin-bottom:10px}

.choices{display:grid;gap:10px}
.choices.pics{grid-template-columns:repeat(2,1fr)}
.ch{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:12px;min-width:0;overflow-wrap:anywhere}
.ch.g{font-family:var(--display);font-size:1.3rem}
.ch .k{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:.85rem;color:var(--muted)}
.pics .ch{flex-direction:column;justify-content:center;text-align:center;padding:12px}
.pics .ch .ill{width:96px;height:96px}
.pics .ch .cap{font-size:.95rem;color:var(--muted);visibility:hidden}
.ch.sel{border-color:var(--t4);background:color-mix(in srgb,var(--t4) 12%,var(--card))}
.ch.right{border-color:var(--ok);background:var(--ok-bg)}
.ch.wrong{border-color:var(--bad);background:var(--bad-bg)}
.ch.right .cap,.ch.wrong .cap{visibility:visible}
.ch:disabled{cursor:default}
.ch.gone{opacity:.35}
.hero-pic{display:flex;justify-content:center;margin-bottom:12px}
.hero-pic .ill{width:140px;height:140px;background:var(--card);border-radius:24px;border:2px solid var(--line);padding:8px}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;min-width:0}

.build-line{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-block:8px;margin-bottom:18px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:1.2rem;cursor:pointer}
.tile.used{visibility:hidden}

.lfoot{border-top:2px solid var(--line);background:var(--card)}
.lfoot-in{max-width:640px;margin:0 auto;padding-block:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.lfoot.ok{background:var(--ok-bg);border-color:var(--ok)}
.lfoot.bad{background:var(--bad-bg);border-color:var(--bad)}
.fbtxt{min-width:0;flex:1 1 220px}
.fbtxt h3{font-size:1.4rem}
.lfoot.ok .fbtxt h3{color:var(--ok-d)} .lfoot.bad .fbtxt h3{color:var(--bad-d)}
:root[data-theme="dark"] .lfoot.ok .fbtxt h3{color:var(--ok)} :root[data-theme="dark"] .lfoot.bad .fbtxt h3{color:var(--bad)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lfoot.ok .fbtxt h3{color:var(--ok)} :root:not([data-theme="light"]) .lfoot.bad .fbtxt h3{color:var(--bad)}}
.fbtxt p{font-weight:700}
.big{border:0;border-radius:16px;padding:12px 26px;font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;color:#fff;background:var(--ok);box-shadow:0 5px 0 var(--ok-d);min-width:160px;flex:1 1 auto;max-width:100%}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ok-d)}
.big:disabled{background:var(--lock);box-shadow:0 5px 0 color-mix(in srgb,var(--lock) 70%,#000);cursor:not-allowed;color:var(--card)}
.big.red{background:var(--bad);box-shadow:0 5px 0 var(--bad-d)}
.big.pink{background:var(--accent);box-shadow:0 5px 0 var(--accent-d)}
.big.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}

/* Palabras nuevas */
.learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lc{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.lc .ill{width:70px;height:70px}
.lc .w{font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--accent);overflow-wrap:anywhere;line-height:1.15}
.lc .t{font-weight:700}
.lc .p{font-size:.75rem;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 8px;margin-top:4px}
@media (max-width:420px){.learn{grid-template-columns:1fr 1fr}}

/* Resultado */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:24px}
.result .mascot{width:130px;height:130px}
.result h2{font-size:2rem;color:var(--gold-d)}
:root[data-theme="dark"] .result h2{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .result h2{color:var(--gold)}}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:460px}
.rs{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--card)}
.rs b{display:block;background:var(--c);color:#fff;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;padding:3px}
.rs span{display:block;font-family:var(--display);font-weight:800;font-size:1.5rem;padding:6px;font-variant-numeric:tabular-nums}

/* Panel familiar */
.fam{max-width:860px;margin:0 auto;padding-block:8px 60px;display:grid;gap:18px}
.fam .field input{width:110px}
.fam h2{font-size:1.7rem}
.fam h3{font-size:1.2rem;margin-bottom:8px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tl{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.tl small{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tl b{font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}
.chart svg{width:100%;height:auto;display:block}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n{font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:800}
.pill.none{background:var(--soft);color:var(--muted)}
.pill.prac{background:color-mix(in srgb,var(--gold) 25%,var(--card));color:var(--ink)}
.pill.dom{background:var(--ok-bg);color:var(--ink)}
.pill.low{background:var(--bad-bg);color:var(--ink)}
.words{display:flex;flex-wrap:wrap;gap:8px}
.wchip{border:2px solid var(--line);border-radius:12px;padding:4px 10px}
.wchip .gn{color:var(--accent)}
.wchip small{color:var(--muted);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field input{font:inherit;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);color:var(--ink);width:180px;max-width:100%}
.smallbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 14px;font-weight:800;cursor:pointer}
.smallbtn.danger{border-color:var(--bad);color:var(--bad)}
.muted{color:var(--muted)}
.gate{max-width:420px;margin:40px auto;text-align:center;display:grid;gap:14px;justify-items:center}
.gate input{font:inherit;font-family:var(--display);font-size:1.6rem;font-weight:800;width:120px;text-align:center;border:2px solid var(--line);border-radius:14px;padding:6px;background:var(--card);color:var(--ink)}
.err{color:var(--bad);font-weight:800;min-height:1.4em}
.brand .ava,.brand svg{width:36px;height:36px;flex:none}
@media (max-width:440px){.iconbtn .lbl{display:none}}
.login{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:24px 40px}
.login .mascot{width:110px;height:110px}
.plist{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:8px}
.pcard{background:var(--card);border:2px solid var(--line);border-bottom-width:6px;border-radius:20px;padding:14px 18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:140px}
.pcard .ava{width:84px;height:84px}
.pcard .gn{font-size:1.4rem}
.dots{display:flex;gap:12px;margin-block:4px 8px}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--accent);display:block}
.dots i.on{background:var(--accent)}
.pwgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:360px;margin:0 auto}
.pwk{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pwk .ill{width:64px;height:64px}
.pwk .gn{font-size:.95rem;color:var(--accent)}
.pwk:active{transform:translateY(3px)}
.pwk:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .4s}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.setup{max-width:640px;margin:0 auto;padding-block:10px 40px;display:grid;gap:14px}
.field{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-weight:700}
.field input{font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);width:180px;max-width:100%}
.avgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:6px}
@media (max-width:520px){.avgrid{grid-template-columns:repeat(4,1fr)}}
.avb{background:var(--bg);border:3px solid var(--line);border-radius:14px;padding:4px;cursor:pointer;min-width:0}
.avb .ill{width:100%;height:auto;aspect-ratio:1}
.avb.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.pwdots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;min-height:76px;margin-bottom:10px}
.pwchosen{display:flex;flex-direction:column;align-items:center;background:var(--soft);border-radius:12px;padding:4px 8px}
.pwchosen .ill{width:44px;height:44px}
.pwchosen small{color:var(--accent)}
.arrow{font-weight:800;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px 4px 6px;font-weight:800;cursor:pointer}
.chip[data-f="all"]{padding-left:14px}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.cava{width:26px;height:26px}
.plrows{display:grid;gap:8px}
.plrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-block:6px}
.cava2{width:40px;height:40px}
.panel.alert{border-color:var(--bad);background:var(--bad-bg)}
.sendgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.sendgrid{grid-template-columns:1fr}}
.sendbox{border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;display:grid;gap:8px;align-content:start}
.sendbox h4{margin:0;font-family:var(--display);font-size:1.1rem;display:flex;gap:6px;align-items:center}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.95rem}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.wa{display:inline-flex;gap:8px;align-items:center;justify-content:center;background:#1FA855;color:#fff;text-decoration:none;font-weight:800;border-radius:14px;padding:10px 16px;box-shadow:0 4px 0 #157A3D;justify-self:start}
.wa:active{transform:translateY(2px);box-shadow:0 2px 0 #157A3D}
.steps summary{cursor:pointer;font-weight:800;color:var(--t4)}
.steps ol{padding-left:20px;display:grid;gap:6px;margin:10px 0}
.steps code{background:var(--soft);border-radius:6px;padding:0 4px}
.code{width:100%;height:180px;margin-top:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px;white-space:pre;overflow:auto}
.toast{width:max-content;max-width:90vw;text-align:center;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:12px;font-weight:800;z-index:40}
</style>

</head>
<body>
<header class="top pad">
  <div class="top-in">
    <div class="brand" id="brand"></div>
    <div class="stat" title="Días seguidos" id="stStreak"></div>
    <div class="stat" title="Puntos XP" id="stXp"></div>
    <button class="iconbtn" type="button" id="famBtn" aria-label="Panel para la familia"></button>
    <button class="iconbtn" type="button" id="outBtn" aria-label="Salir y cambiar de jugador" hidden></button>
  </div>
</header>
<main class="home pad" id="home"></main>
<div id="layer"></div>

<script>
(function(){
/* ---------- Ilustraciones ---------- */
const G = s => `<svg viewBox="0 0 80 80" class="ill" aria-hidden="true"><g style="stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round" fill="none">${s}</g></svg>`;
const INK = 'style="fill:var(--ink)" stroke="none"';

const eyes = (a,b,y,r=2.2)=>`<circle cx="${a}" cy="${y}" r="${r}" ${INK}/><circle cx="${b}" cy="${y}" r="${r}" ${INK}/>`;
function rays(cx,cy,r1,r2,angles){return angles.map(a=>{const t=a*Math.PI/180;return `<line x1="${(cx+r1*Math.cos(t)).toFixed(1)}" y1="${(cy+r1*Math.sin(t)).toFixed(1)}" x2="${(cx+r2*Math.cos(t)).toFixed(1)}" y2="${(cy+r2*Math.sin(t)).toFixed(1)}"/>`}).join('')}
function starPts(cx,cy,R,r){let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}

function person(o){
  const hc=o.hc||'#4A2E1F'; let s='';
  if(o.hair==='long') s+=`<path d="M25 30 Q25 12 40 12 Q55 12 55 30 L57 52 L23 52Z" fill="${hc}"/>`;
  if(o.hair==='pig') s+=`<circle cx="24" cy="31" r="6" fill="${hc}"/><circle cx="56" cy="31" r="6" fill="${hc}"/>`;
  if(o.hair==='bun') s+=`<circle cx="40" cy="13" r="6.5" fill="${hc}"/>`;
  s+=`<path d="M20 75 Q20 48 40 48 Q60 48 60 75Z" fill="${o.shirt}"/>`;
  s+=`<circle cx="40" cy="31" r="13" fill="${SK}"/>`;
  s+=`<path d="M27 29 Q28 16 40 16 Q52 16 53 29 Q46 23 40 23 Q33 23 27 29Z" fill="${hc}"/>`;
  s+=eyes(35.5,44.5,31,1.9);
  if(o.beard) s+=`<path d="M30 35 Q40 48 50 35 Q46 42 40 42 Q34 42 30 35Z" fill="${hc}"/>`;
  else s+=`<path d="M36 36 Q40 39.5 44 36"/>`;
  if(o.mus) s+=`<path d="M35 35.5 Q40 33 45 35.5" style="stroke-width:3"/>`;
  if(o.glasses) s+=`<circle cx="35.5" cy="31" r="4.2" style="stroke-width:1.8"/><circle cx="44.5" cy="31" r="4.2" style="stroke-width:1.8"/><line x1="39.7" y1="31" x2="40.3" y2="31" style="stroke-width:1.8"/>`;
  if(o.cane) s+=`<path d="M66 76 L66 50 Q66 43 60 45" style="stroke-width:3.4"/>`;
  return s;
}
const place=(inner,cx,sc)=>`<g transform="translate(${cx} 77) scale(${sc}) translate(-40 -76)">${inner}</g>`;

  s+=`<path d="M29 52 L13 49 M29 55 L13 59 M51 52 L67 49 M51 55 L67 59" style="stroke-width:1.8"/>`;
  return s;
}

}

async function connectDb(){
  if(!window.claude||typeof window.claude.use!=='function'){ready=true;renderAll();return}
  let d=null; try{d=await window.claude.use('db')}catch(e){d=null}
  if(!d){ready=true;renderAll();return}
  db=d; storeMode='account';
  const pend=LS.get('gn-pending',[]);const left=[];
  for(const s of pend){try{await db.collection('sessions').doc(s.id).set(s)}catch(e){left.push(s)}}
  LS.set('gn-pending',left);
  let gotSettings=false;
  db.doc('settings/main').onSnapshot(snap=>{
    settings=snap.exists?Object.assign({},snap.data()):{};
    gotSettings=true;ready=true;
    if(current) current=players().find(p=>p.id===current.id)||null;
    renderAll();
  },()=>{ready=true;renderAll()});
  db.collection('sessions').onSnapshot(snap=>{
    sessions=snap.docs.map(x=>Object.assign({id:x.id},x.data())).sort((a,b)=>a.ts-b.ts);
    if(gotSettings) renderAll();
  },()=>{});
  db.collection('logins').onSnapshot(snap=>{
    logins=snap.docs.flatMap(x=>(x.data().entries||[])).sort((a,b)=>a.ts-b.ts);
    if(screen==='fam') renderFamily();
  },()=>{});

async function flushOutbox(){

      const box=LS.get('gn-outbox',[]);if(!box.length) break;
      const item=box[0];
      try{await fetch(settings.sheetUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(item)})}

/* ---------- Cálculos ---------- */
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>dayKey(Date.now());
function streak(list=mine()){
  const days=new Set(list.map(s=>s.day));let d=new Date();d.setHours(12,0,0,0);
  if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  let n=0;while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n;
}
const totalXp=(list=mine())=>list.reduce((a,s)=>a+(s.xp||0),0);
const xpToday=()=>mine().filter(s=>s.day===today()).reduce((a,s)=>a+(s.xp||0),0);
const doneCount=id=>mine().filter(s=>s.unit===id).length;
function unlocked(i){const u=UNITS[i];return i===0||u.extra||doneCount(UNITS[i-1].id)>0}
function missMap(id){const m={};mine().filter(s=>s.unit===id).forEach(s=>(s.mistakes||[]).forEach(w=>m[w]=(m[w]||0)+1));return m}

/* ---------- Sonido ---------- */
let actx=null;
function beep(ok){
  if(!soundOn) return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=ok?[660,880]:[300,220];
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
      const t=actx.currentTime+i*.12;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.2)});
  }catch(e){}
}

const norm=s=>s.toLowerCase().replace(/[.,!?¡¿]/g,'').replace(/\s+/g,' ').trim();

function buildExercises(u){
  const items=u.items, miss=missMap(u.id);
  const weighted=shuffle(items).sort((a,b)=>(miss[b[0]]||0)-(miss[a[0]]||0));
  const targets=[];let k=0;while(targets.length<7){targets.push(weighted[k%weighted.length]);k++}
  const phrases=items.filter(it=>it[0].trim().split(/\s+/).length>=2);
  const ex=[];
  const types=['pic','es2gn','gn2es','tf','pic','es2gn','gn2es'];
  targets.forEach((t,j)=>{
    let ty=types[j];
    if(ty==='pic'){const ok=items.filter(x=>x[3]!==t[3]);if(new Set(ok.map(x=>x[3])).size<3) ty='es2gn'}
    ex.push({ty,t});
  });
  ex.splice(3,0,{ty:'match',set:pick(items.filter((x,ix,a)=>a.findIndex(y=>y[1]===x[1])===ix),4)});
  pick(phrases,Math.min(2,phrases.length)).forEach((p,j)=>ex.splice(5+j*2,0,{ty:'build',t:p}));
  return ex.slice(0,10).map((e,ix)=>Object.assign(e,{key:ix}));
}

  if(e.ty==='pic'){
    const others=[];shuffle(u.items).forEach(x=>{if(x[3]!==e.t[3]&&!others.some(o=>o[3]===x[3])&&others.length<3)others.push(x)});

    check=sel=>({ok:o[sel]===e.t,ans:`${e.t[0]} = ${e.t[1]}`});
  } else if(e.ty==='es2gn'){
    const o=opts3(e.t,x=>x[0]);
    box.innerHTML=`<p class="kind">¿Cómo se dice en guaraní?</p><div class="hero-pic">${icon(e.t[3])}</div>${ask(`<b>${e.t[1]}</b>`)}
      <div class="choices">${o.map((x,k)=>`<button type="button" class="ch g" data-k="${k}"><span class="k">${k+1}</span>${x[0]}</button>`).join('')}</div>`;
    check=sel=>({ok:o[sel]===e.t,ans:e.t[0]});
  } else if(e.ty==='gn2es'){
    const o=opts3(e.t,x=>x[1]);
    box.innerHTML=`<p class="kind">¿Qué quiere decir?</p>${ask(`<b class="gn">${e.t[0]}</b>`)}
      <div class="choices">${o.map((x,k)=>`<button type="button" class="ch" data-k="${k}"><span class="k">${k+1}</span>${x[1]}</button>`).join('')}</div>`;
    check=sel=>({ok:o[sel]===e.t,ans:e.t[1]});
  } else if(e.ty==='tf'){
    const truth=Math.random()<.5;
    const shown=truth?e.t:pick(u.items.filter(x=>x[3]!==e.t[3]&&x[0]!==e.t[0]),1)[0]||e.t;
    const isTrue=shown===e.t;
    box.innerHTML=`<p class="kind">¿Es correcto?</p><div class="hero-pic">${icon(e.t[3])}</div>${ask(`¿Esto es <b class="gn">${shown[0]}</b>?`)}
      <div class="choices pics"><button type="button" class="ch g" data-k="0" style="flex-direction:row"><span class="k">1</span>Hẽe · Sí</button><button type="button" class="ch g" data-k="1" style="flex-direction:row"><span class="k">2</span>Nahániri · No</button></div>`;
    check=sel=>({ok:(sel===0)===isTrue,ans:`El dibujo es ${e.t[0]} (${e.t[1]})`});
  } else if(e.ty==='build'){
    const words=e.t[0].split(/\s+/);
    const extra=pick(u.items.flatMap(x=>x[0].split(/\s+/)).filter(w=>!words.some(v=>norm(v)===norm(w))).filter((w,ix,a)=>a.indexOf(w)===ix),2);

    box.querySelector('#bline').onclick=ev=>{const t=ev.target.closest('.tile');if(!t||L.locked)return;line.splice(+t.dataset.l,1);draw()};

      <div class="match"><div class="col">${left.map(x=>`<button type="button" class="ch g" data-m="l" data-i="${e.set.indexOf(x)}">${x[0]}</button>`).join('')}</div>
      <div class="col">${right.map(x=>`<button type="button" class="ch" data-m="r" data-i="${e.set.indexOf(x)}">${x[1]}</button>`).join('')}</div></div>`;

function footCheck(fn){

function resolve(ok,ans,isMatch){
  const e=L.queue[L.pos];

    if(!L.retried.has(e.key)){L.firstWrong.add(e.key);if(e.t)L.mistakes.add(e.t[0]);
      if(!isMatch){L.queue.push(Object.assign({},e,{retry:true}));L.retried.add(e.key)}}
  }
  if(ok||isMatch) L.doneOk++;
  beep(ok);
  const pr=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  if(ok) setFoot('ok',`<div class="fbtxt"><h3>${pr[0]}</h3><p>${pr[1]}</p></div><button class="big" type="button" id="cont">Continuar</button>`);
  else if(isMatch) setFoot('ok',`<div class="fbtxt"><h3>¡Listo!</h3><p>Encontraste todas las parejas.</p></div><button class="big" type="button" id="cont">Continuar</button>`);
  else setFoot('bad',`<div class="fbtxt"><h3>Casi…</h3><p>La respuesta es: <span class="gn">${esc(ans)}</span></p>${L.retried.has(e.key)&&!e.retry?'<p class="muted" style="font-size:.9rem">Te la vuelvo a preguntar al final.</p>':''}</div><button class="big red" type="button" id="cont">Entendido</button>`);

  c.onclick=()=>{L.pos++;showEx()};
}

    ${after>before?`<p style="font-weight:800">${UI.flame(true).replace('<svg','<svg style="width:22px;height:22px;vertical-align:-4px"')} ¡Racha de ${after} ${after===1?'día':'días'}!</p>`:''}

    ${waDigits()&&settings.kidShare!==false?`<a class="wa" target="_blank" rel="noopener" href="${waLink(`${p.name} terminó la lección "${L.u.es}" de guaraní: ${correct} de ${total} correctas (${pct}%), +${xp} XP, en ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}.${s.mistakes.length?' Para repasar: '+s.mistakes.join(', ')+'.':''} 🐆`)}">${UI.chat()} Contale a tu familia</a>`:''}</div>`;

function fmtDate(ts){const d=new Date(ts);return d.toLocaleDateString('es-PY',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'})}

function chart14(list){
  const days=[];const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-13);
  for(let i=0;i<14;i++){const k=dayKey(d);days.push({k,label:d.getDate(),wd:'DLMMJVS'[d.getDay()],xp:list.filter(s=>s.day===k).reduce((a,s)=>a+s.xp,0)});d.setDate(d.getDate()+1)}
  const max=Math.max(DAILY_GOAL,...days.map(x=>x.xp));const top=Math.ceil(max/10)*10;
  const W=640,H=220,l=34,r=10,t=14,b=40,cw=(W-l-r)/14;
  const y=v=>t+(H-t-b)*(1-v/top);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="XP por día en las últimas dos semanas">`;
  [0,top/2,top].forEach(v=>{s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${v}</text>`});
  s+=`<line x1="${l}" x2="${W-r}" y1="${y(DAILY_GOAL)}" y2="${y(DAILY_GOAL)}" style="stroke:var(--gold);stroke-dasharray:5 4;stroke-width:1.5"/><text x="${l+4}" y="${y(DAILY_GOAL)-5}" text-anchor="start" font-size="11" font-weight="700" style="fill:var(--gold-d)">meta ${DAILY_GOAL}</text>`;
  days.forEach((x,i)=>{const cx=l+i*cw+cw/2,bw=cw*.62;
    if(x.xp>0) s+=`<rect x="${cx-bw/2}" y="${y(x.xp)}" width="${bw}" height="${y(0)-y(x.xp)}" rx="4" style="fill:${x.xp>=DAILY_GOAL?'var(--ok)':'var(--t4)'}"><title>${x.k}: ${x.xp} XP</title></rect><text x="${cx}" y="${y(x.xp)-4}" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--ink)">${x.xp}</text>`;

  return s+'</svg>';

            </ol>
            <div class="row"><button class="smallbtn" type="button" id="codeCopy">Copiar el código</button></div>
            <textarea id="codeT" readonly class="code">${esc(GAS_CODE)}</textarea></details>`}
          </div>
        </div>
      </div>
      <div class="panel"><h3>Ajustes</h3>
        <div class="row">
          <button class="smallbtn" type="button" id="sndB">${UI.sound(soundOn).replace('<svg','<svg style="width:18px;height:18px;vertical-align:-3px"')} Sonido: ${soundOn?'sí':'no'}</button>
          <button class="smallbtn" type="button" id="copyB">Copiar informe</button>
          <button class="smallbtn danger" type="button" id="resetB">Borrar el progreso${famFilter==='all'?' de todos':' de '+esc(pName(famFilter))}</button>
          <span id="resetAsk" hidden><b>¿Seguro? No se puede deshacer.</b> <button class="smallbtn danger" type="button" id="resetYes">Sí, borrar</button> <button class="smallbtn" type="button" id="resetNo">Cancelar</button></span>
        </div>
        <p class="muted" style="margin-top:12px;font-size:.9rem">${storeMode==='account'?'Los resultados se guardan en tu cuenta de Claude: los ves desde cualquier dispositivo donde abras esta página.':'Los resultados se guardan solo en este dispositivo y navegador. Para verlos, abrí este panel en el mismo dispositivo donde juega.'}</p>
        <textarea id="repT" hidden readonly style="width:100%;height:160px;margin-top:10px;font:inherit;font-size:.85rem"></textarea>
      </div>
    </div></div></div>`,'fam');
  $('#lx').onclick=()=>{if(current)closeLayer();else{screen=null;$('#layer').innerHTML='';renderAll()}};
  const ch=$('#chips');if(ch)ch.onclick=e=>{const b=e.target.closest('.chip');if(b){famFilter=b.dataset.f;renderFamily()}};
  $('#sndB').onclick=()=>{soundOn=!soundOn;LS.set('gn-sound',soundOn);renderFamily()};
  $('#copyB').onclick=()=>{const r=report(list);
    const fallback=()=>{const ta=$('#repT');ta.hidden=false;ta.value=r;ta.select();toast('Seleccioná y copiá el texto')};
    try{navigator.clipboard.writeText(r).then(()=>toast('Informe copiado'),fallback)}catch(e){fallback()}};
  $('#resetB').onclick=()=>{$('#resetAsk').hidden=false};
  $('#resetNo').onclick=()=>{$('#resetAsk').hidden=true};
  $('#resetYes').onclick=async()=>{await resetProgress(famFilter);toast('Progreso borrado');renderFamily();renderTop()};
  $('#waF').onsubmit=async ev=>{ev.preventDefault();const v=$('#waIn').value.replace(/\D/g,'');
    if(v&&v.length<8){toast('Revisá el número: falta el código de país');return}
    settings=Object.assign({},settings,{waNumber:v});if(await saveSettings()){toast(v?'Número guardado':'Número borrado');renderFamily()}};
  $('#kidS').onchange=async ev=>{settings=Object.assign({},settings,{kidShare:ev.target.checked});await saveSettings()};
  const shF=$('#shF');if(shF)shF.onsubmit=async ev=>{ev.preventDefault();const v=$('#shIn').value.trim();
    if(v&&!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(v)){toast('Esa dirección no es de Apps Script. Tiene que terminar en /exec');return}
    settings=Object.assign({},settings,{sheetUrl:v});if(await saveSettings()){toast(v?'Planilla guardada':'Planilla desconectada');flushOutbox();renderFamily()}};
  const shT=$('#shTest');if(shT)shT.onclick=()=>{sendToSheet({type:'prueba',ts:Date.now(),player:'Prueba desde la app'});toast('Prueba enviada: revisá la planilla')};
  const cc=$('#codeCopy');if(cc)cc.onclick=()=>{const ta=$('#codeT');try{navigator.clipboard.writeText(GAS_CODE).then(()=>toast('Código copiado'),()=>{ta.select();toast('Seleccioná y copiá el texto')})}catch(e){ta.select()}};
  $('#pinB').onclick=()=>{$('#pinF').hidden=false;$('#np1').focus()};
  $('#pinF').onsubmit=async ev=>{ev.preventDefault();const a=$('#np1').value,b=$('#np2').value;
    if(!/^\d{4}$/.test(a)){toast('El PIN tiene que tener 4 números');return}if(a!==b){toast('Los dos PIN no son iguales');return}
    settings=Object.assign({},settings,{pinHash:hash('pin:'+a)});if(await saveSettings()){toast('PIN cambiado');renderFamily()}};
  $('#addP').onclick=()=>playerForm({title:'Agregar jugador',back:()=>renderFamily(),
    onSave:async p=>{settings=Object.assign({},settings,{players:players().concat([p])});if(await saveSettings()){toast(p.name+' ya puede entrar');renderFamily()}}});
  $('#layer').querySelector('.plrows').onclick=e=>{
    const ed=e.target.closest('[data-edit]'),dl=e.target.closest('[data-del]');
    if(ed){const p=players().find(x=>x.id===ed.dataset.edit);playerForm({title:'Cambiar '+p.name,player:p,back:()=>renderFamily(),
      onSave:async np=>{settings=Object.assign({},settings,{players:players().map(x=>x.id===np.id?np:x)});if(current&&current.id===np.id)current=np;if(await saveSettings()){toast('Guardado');renderFamily()}}})}
    if(dl){const p=players().find(x=>x.id===dl.dataset.del);const box=$('#delAsk');box.hidden=false;
      box.innerHTML=`<b>¿Quitar a ${esc(p.name)}?</b> Sus lecciones quedan en el historial. <button class="smallbtn danger" type="button" id="delYes">Sí, quitar</button> <button class="smallbtn" type="button" id="delNo">Cancelar</button>`;
      $('#delNo').onclick=()=>{box.hidden=true};
      $('#delYes').onclick=async()=>{settings=Object.assign({},settings,{players:players().filter(x=>x.id!==p.id)});if(current&&current.id===p.id)current=null;if(famFilter===p.id)famFilter='all';if(await saveSettings())renderFamily()}}
  };
}

/* ---------- Arranque ---------- */
renderAll();
connectDb().then(flushOutbox);
})();
</script>

</body>
</html>
